<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 668.516 520" width="668.516" height="520" style="--bg:#101d2e;--fg:#ecf3f8;--line:#839ab5;--accent:#93e3d1;background:var(--bg)">
<style>
  text { font-family: 'system-ui', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="R" x1="96.2515" y1="70" x2="96.2515" y2="490" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="F" x1="258.3805" y1="70" x2="258.3805" y2="490" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="D" x1="416.0635" y1="70" x2="416.0635" y2="490" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="W" x1="578.1925" y1="70" x2="578.1925" y2="490" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="R" data-to="F" data-label="Acquire for partition 7" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="96.2515" y1="90" x2="258.3805" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="177.31599999999997" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Acquire for partition 7</text>
</g>
<g class="message" data-from="F" data-to="D" data-label="Start if absent, then connect to advertised address" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="258.3805" y1="130" x2="416.0635" y2="130" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="337.222" y="120" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Start if absent, then connect to advertised address</text>
</g>
<g class="message" data-from="D" data-to="W" data-label="Fork child with accepted socket" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="416.0635" y1="170" x2="578.1925" y2="170" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="497.128" y="160" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Fork child with accepted socket</text>
</g>
<g class="message" data-from="W" data-to="F" data-label="Report child PID, then complete TCP handshake" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="578.1925" y1="210" x2="258.3805" y2="210" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="418.2865" y="200" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Report child PID, then complete TCP handshake</text>
</g>
<g class="message" data-from="F" data-to="R" data-label="Connected worker and handle" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="258.3805" y1="250" x2="96.2515" y2="250" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="177.31599999999997" y="240" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Connected worker and handle</text>
</g>
<g class="message" data-from="R" data-to="W" data-label="Run partition 7 over the socket" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="96.2515" y1="290" x2="578.1925" y2="290" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="337.222" y="280" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Run partition 7 over the socket</text>
</g>
<g class="message" data-from="W" data-to="R" data-label="Results and clean end-of-stream reply" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="578.1925" y1="330" x2="96.2515" y2="330" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="337.222" y="320" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Results and clean end-of-stream reply</text>
</g>
<g class="message" data-from="R" data-to="F" data-label="Release if reuse is enabled" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="96.2515" y1="370" x2="258.3805" y2="370" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="177.31599999999997" y="360" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Release if reuse is enabled</text>
</g>
<g class="message" data-from="R" data-to="F" data-label="Acquire for partition 8 with the same key" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="96.2515" y1="410" x2="258.3805" y2="410" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="177.31599999999997" y="400" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Acquire for partition 8 with the same key</text>
</g>
<g class="message" data-from="F" data-to="R" data-label="Return live idle child, or create another" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="258.3805" y1="450" x2="96.2515" y2="450" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="177.31599999999997" y="440" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Return live idle child, or create another</text>
</g>
<g class="actor" data-id="R" data-label="Executor runner" data-type="participant">
  <rect x="30" y="30" width="132.503" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="96.2515" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Executor runner</text>
</g>
<g class="actor" data-id="F" data-label="Local factory" data-type="participant">
  <rect x="202.503" y="30" width="111.75500000000001" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="258.3805" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Local factory</text>
</g>
<g class="actor" data-id="D" data-label="Python daemon" data-type="participant">
  <rect x="354.258" y="30" width="123.61099999999999" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="416.0635" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Python daemon</text>
</g>
<g class="actor" data-id="W" data-label="Python worker" data-type="participant">
  <rect x="517.869" y="30" width="120.647" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="578.1925" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Python worker</text>
</g>
</svg>