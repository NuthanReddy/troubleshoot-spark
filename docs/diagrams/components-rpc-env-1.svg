<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864.881 360" width="864.881" height="360" style="--bg:#101d2e;--fg:#ecf3f8;--line:#839ab5;--accent:#93e3d1;background:var(--bg)">
<style>
  text { font-family: 'system-ui', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="E" x1="115.14699999999999" y1="70" x2="115.14699999999999" y2="330" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="D" x1="314.326" y1="70" x2="314.326" y2="330" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="G" x1="500.908" y1="70" x2="500.908" y2="330" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="B" x1="724.1695" y1="70" x2="724.1695" y2="330" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="E" data-to="D" data-label="Open connection and register client-only endpoint ref" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="115.14699999999999" y1="90" x2="314.326" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="214.7365" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Open connection and register client-only endpoint ref</text>
</g>
<g class="message" data-from="D" data-to="E" data-label="LaunchTask over the existing connection" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="314.326" y1="130" x2="115.14699999999999" y2="130" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="214.7365" y="120" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">LaunchTask over the existing connection</text>
</g>
<g class="message" data-from="E" data-to="D" data-label="FINISHED with an indirect result reference" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="115.14699999999999" y1="170" x2="314.326" y2="170" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="214.7365" y="160" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">FINISHED with an indirect result reference</text>
</g>
<g class="message" data-from="D" data-to="G" data-label="Enqueue result" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="314.326" y1="210" x2="500.908" y2="210" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="407.617" y="200" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Enqueue result</text>
</g>
<g class="message" data-from="G" data-to="B" data-label="Fetch result block over the data service" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="500.908" y1="250" x2="724.1695" y2="250" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="612.5387499999999" y="240" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Fetch result block over the data service</text>
</g>
<g class="message" data-from="B" data-to="G" data-label="Serialized result bytes" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="724.1695" y1="290" x2="500.908" y2="290" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="612.5387499999999" y="280" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Serialized result bytes</text>
</g>
<g class="actor" data-id="E" data-label="Executor RPC endpoint" data-type="participant">
  <rect x="30" y="30" width="170.29399999999998" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="115.14699999999999" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Executor RPC endpoint</text>
</g>
<g class="actor" data-id="D" data-label="Driver RPC listener" data-type="participant">
  <rect x="240.294" y="30" width="148.06400000000002" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="314.326" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Driver RPC listener</text>
</g>
<g class="actor" data-id="G" data-label="Driver result getter" data-type="participant">
  <rect x="428.358" y="30" width="145.10000000000002" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="500.908" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Driver result getter</text>
</g>
<g class="actor" data-id="B" data-label="Executor block-transfer listener" data-type="participant">
  <rect x="613.458" y="30" width="221.42299999999997" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="724.1695" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Executor block-transfer listener</text>
</g>
</svg>