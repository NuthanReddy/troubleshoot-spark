  <text x="101.4385" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Executor backend</text>
</g>
<g class="actor" data-id="D" data-label="DriverEndpoint" data-type="participant">
