  <line x1="101.4385" y1="90" x2="275.053" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="188.24575" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">RegisterExecutor(id=3, cores=2)</text>
</g>
