<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 503.524 560" width="503.524" height="560" style="--bg:#101d2e;--fg:#ecf3f8;--line:#839ab5;--accent:#93e3d1;background:var(--bg)">
<style>
  text { font-family: 'system-ui', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="C" x1="112.5535" y1="70" x2="112.5535" y2="530" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="N" x1="283.945" y1="70" x2="283.945" y2="530" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="D" x1="423.945" y1="70" x2="423.945" y2="530" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="C" data-to="N" data-label="getBlockLocations for input file and byte range" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="112.5535" y1="90" x2="283.945" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="198.24925" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">getBlockLocations for input file and byte range</text>
</g>
<g class="message" data-from="N" data-to="C" data-label="Block IDs, offsets and replica addresses" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="283.945" y1="130" x2="112.5535" y2="130" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="198.24925" y="120" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Block IDs, offsets and replica addresses</text>
</g>
<g class="message" data-from="C" data-to="D" data-label="Read from a chosen replica" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="112.5535" y1="170" x2="423.945" y2="170" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="268.24925" y="160" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Read from a chosen replica</text>
</g>
<g class="message" data-from="D" data-to="C" data-label="Parquet bytes and checksums" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="423.945" y1="210" x2="112.5535" y2="210" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="268.24925" y="200" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Parquet bytes and checksums</text>
</g>
<g class="message" data-from="C" data-to="N" data-label="create output part, then addBlock" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="112.5535" y1="250" x2="283.945" y2="250" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="198.24925" y="240" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">create output part, then addBlock</text>
</g>
<g class="message" data-from="N" data-to="C" data-label="Block ID and write pipeline targets" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="283.945" y1="290" x2="112.5535" y2="290" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="198.24925" y="280" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Block ID and write pipeline targets</text>
</g>
<g class="message" data-from="C" data-to="D" data-label="Send packets to the head of the write pipeline" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="112.5535" y1="330" x2="423.945" y2="330" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="268.24925" y="320" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Send packets to the head of the write pipeline</text>
</g>
<g class="message" data-from="D" data-to="C" data-label="Pipeline acknowledgements" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="423.945" y1="370" x2="112.5535" y2="370" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="268.24925" y="360" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Pipeline acknowledgements</text>
</g>
<g class="message" data-from="D" data-to="N" data-label="Report received replicas" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="423.945" y1="410" x2="283.945" y2="410" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="353.945" y="400" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Report received replicas</text>
</g>
<g class="message" data-from="C" data-to="N" data-label="complete the output part" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="112.5535" y1="450" x2="283.945" y2="450" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="198.24925" y="440" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">complete the output part</text>
</g>
<g class="message" data-from="N" data-to="C" data-label="File closed when progress checks pass" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="283.945" y1="490" x2="112.5535" y2="490" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="198.24925" y="480" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">File closed when progress checks pass</text>
</g>
<g class="actor" data-id="C" data-label="Hadoop client in Spark" data-type="participant">
  <rect x="30" y="30" width="165.107" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="112.5535" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Hadoop client in Spark</text>
</g>
<g class="actor" data-id="N" data-label="NameNode" data-type="participant">
  <rect x="235.107" y="30" width="97.676" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="283.945" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">NameNode</text>
</g>
<g class="actor" data-id="D" data-label="DataNodes" data-type="participant">
  <rect x="374.366" y="30" width="99.158" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="423.945" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">DataNodes</text>
</g>
</svg>