<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 918.8239999999998 415" width="918.8239999999998" height="415" style="--bg:#101d2e;--fg:#ecf3f8;--line:#839ab5;--accent:#93e3d1;background:var(--bg)">
<style>
  text { font-family: 'system-ui', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="D" x1="118.11099999999999" y1="70" x2="118.11099999999999" y2="385" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="P" x1="303.5815" y1="70" x2="303.5815" y2="385" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="R" x1="474.60249999999996" y1="70" x2="474.60249999999996" y2="385" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="N" x1="647.8464999999999" y1="70" x2="647.8464999999999" y2="385" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="A" x1="818.1264999999999" y1="70" x2="818.1264999999999" y2="385" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="D" data-to="P" data-label="Start orders.py on the submit host" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="118.11099999999999" y1="90" x2="303.5815" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="210.84625" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Start orders.py on the submit host</text>
</g>
<g class="message" data-from="P" data-to="D" data-label="Initialize SparkContext and driver RPC listener" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="303.5815" y1="130" x2="118.11099999999999" y2="130" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="210.84625" y="120" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Initialize SparkContext and driver RPC listener</text>
</g>
<g class="message" data-from="D" data-to="R" data-label="Submit YARN application with driver host and port" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="118.11099999999999" y1="170" x2="474.60249999999996" y2="170" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="296.35675" y="160" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Submit YARN application with driver host and port</text>
</g>
<g class="message" data-from="R" data-to="N" data-label="Launch AM container" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="474.60249999999996" y1="210" x2="647.8464999999999" y2="210" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="561.2244999999999" y="200" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Launch AM container</text>
</g>
<g class="message" data-from="N" data-to="A" data-label="Start AM without the user driver" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="647.8464999999999" y1="250" x2="818.1264999999999" y2="250" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="732.9864999999999" y="240" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Start AM without the user driver</text>
</g>
<g class="message" data-from="A" data-to="R" data-label="Register AM" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="818.1264999999999" y1="290" x2="474.60249999999996" y2="290" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="646.3644999999999" y="280" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Register AM</text>
</g>
<g class="message" data-from="A" data-to="D" data-label="Connect back to the existing driver" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="818.1264999999999" y1="330" x2="118.11099999999999" y2="330" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="468.1187499999999" y="320" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Connect back to the existing driver</text>
</g>
<g class="note" data-position="over" data-actors="A,D">
  <polygon points="349.5617499999999,338 580.6757499999999,338 586.6757499999999,344 586.6757499999999,361 349.5617499999999,361" fill="var(--bg)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="580.6757499999999,338 586.6757499999999,344 580.6757499999999,344" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="468.1187499999999" y="349.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Executors launched by the AM register with D</text>
</g>
<g class="actor" data-id="D" data-label="Submit host / driver JVM" data-type="participant">
  <rect x="30" y="30" width="176.22199999999998" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="118.11099999999999" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Submit host / driver JVM</text>
</g>
<g class="actor" data-id="P" data-label="Python driver" data-type="participant">
  <rect x="246.222" y="30" width="114.71900000000001" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="303.5815" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Python driver</text>
</g>
<g class="actor" data-id="R" data-label="ResourceManager" data-type="participant">
  <rect x="400.941" y="30" width="147.32299999999998" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="474.60249999999996" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">ResourceManager</text>
</g>
<g class="actor" data-id="N" data-label="NodeManager" data-type="participant">
  <rect x="588.2639999999999" y="30" width="119.16499999999999" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="647.8464999999999" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">NodeManager</text>
</g>
<g class="actor" data-id="A" data-label="ApplicationMaster" data-type="participant">
  <rect x="747.4289999999999" y="30" width="141.395" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="818.1264999999999" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">ApplicationMaster</text>
</g>
</svg>