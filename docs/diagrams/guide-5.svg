<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 853.616 445" width="853.616" height="445" style="--bg:#101d2e;--fg:#ecf3f8;--line:#839ab5;--accent:#93e3d1;background:var(--bg)">
<style>
  text { font-family: 'system-ui', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="P" x1="87.3595" y1="70" x2="87.3595" y2="415" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="D" x1="259.12149999999997" y1="70" x2="259.12149999999997" y2="415" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="E" x1="421.621" y1="70" x2="421.621" y2="415" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="R" x1="583.3795" y1="70" x2="583.3795" y2="415" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="N" x1="760.3285" y1="70" x2="760.3285" y2="415" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="D" data-to="P" data-label="Last action returns after successful commit" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="259.12149999999997" y1="90" x2="87.3595" y2="90" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="173.2405" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Last action returns after successful commit</text>
</g>
<g class="message" data-from="P" data-to="D" data-label="spark.stop() stops SparkContext" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="87.3595" y1="130" x2="259.12149999999997" y2="130" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="173.2405" y="120" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">spark.stop() stops SparkContext</text>
</g>
<g class="message" data-from="D" data-to="E" data-label="StopExecutor" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="259.12149999999997" y1="170" x2="421.621" y2="170" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="340.37125" y="160" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">StopExecutor</text>
</g>
<g class="message" data-from="E" data-to="E" data-label="Release resources and stop workers" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="421.621,210 451.621,210 451.621,230 421.621,230" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="459.621" y="220" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Release resources and stop workers</text>
</g>
<g class="message" data-from="P" data-to="D" data-label="Script exits normally" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="87.3595" y1="280" x2="259.12149999999997" y2="280" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="173.2405" y="270" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Script exits normally</text>
</g>
<g class="message" data-from="D" data-to="R" data-label="AM unregisters with final status SUCCEEDED" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="259.12149999999997" y1="320" x2="583.3795" y2="320" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="421.2505" y="310" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">AM unregisters with final status SUCCEEDED</text>
</g>
<g class="message" data-from="R" data-to="N" data-label="Clean up any remaining application containers" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="583.3795" y1="360" x2="760.3285" y2="360" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="671.854" y="350" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Clean up any remaining application containers</text>
</g>
<g class="note" data-position="over" data-actors="R,N">
  <polygon points="530.1310000000001,368 807.577,368 813.577,374 813.577,391 530.1310000000001,391" fill="var(--bg)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="807.577,368 813.577,374 807.577,374" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="671.854" y="379.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Container exits and cleanup reports are asynchronous</text>
</g>
<g class="actor" data-id="P" data-label="Python driver" data-type="participant">
  <rect x="29.999999999999993" y="30" width="114.71900000000001" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="87.3595" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Python driver</text>
</g>
<g class="actor" data-id="D" data-label="AM and driver JVM" data-type="participant">
  <rect x="184.71899999999997" y="30" width="148.805" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="259.12149999999997" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">AM and driver JVM</text>
</g>
<g class="actor" data-id="E" data-label="Executors" data-type="participant">
  <rect x="373.524" y="30" width="96.194" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="421.621" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Executors</text>
</g>
<g class="actor" data-id="R" data-label="ResourceManager" data-type="participant">
  <rect x="509.718" y="30" width="147.32299999999998" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="583.3795" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">ResourceManager</text>
</g>
<g class="actor" data-id="N" data-label="NodeManagers" data-type="participant">
  <rect x="697.0409999999999" y="30" width="126.57499999999999" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="760.3285" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">NodeManagers</text>
</g>
</svg>