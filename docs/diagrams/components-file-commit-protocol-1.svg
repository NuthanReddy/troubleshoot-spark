<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910.823 468" width="910.823" height="468" style="--bg:#101d2e;--fg:#ecf3f8;--line:#839ab5;--accent:#93e3d1;background:var(--bg)">
<style>
  text { font-family: 'system-ui', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<g class="block" data-type="opt" data-label="Hadoop needs task commit and coordination enabled">
  <rect x="183.61099999999996" y="158" width="445.789" height="100" rx="0" ry="0" fill="none" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="183.61099999999996" y="158" width="312.6699999999999" height="18" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="189.61099999999996" y="167" font-size="11" font-weight="600" fill="var(--_text-sec)" dy="3.8499999999999996">opt [Hadoop needs task commit and coordination enabled]</text>
</g>
<line class="lifeline" data-actor="D" x1="91.8055" y1="70" x2="91.8055" y2="438" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="E" x1="293.94849999999997" y1="70" x2="293.94849999999997" y2="438" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="C" x1="526.843" y1="70" x2="526.843" y2="438" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="H" x1="770.1115" y1="70" x2="770.1115" y2="438" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="D" data-to="H" data-label="setupJob with staging output path" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="91.8055" y1="90" x2="770.1115" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="430.95849999999996" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">setupJob with staging output path</text>
</g>
<g class="message" data-from="E" data-to="H" data-label="setupTask, then write to attempt work path" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="293.94849999999997" y1="130" x2="770.1115" y2="130" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="532.03" y="120" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">setupTask, then write to attempt work path</text>
</g>
<g class="message" data-from="E" data-to="C" data-label="May this attempt commit this partition?" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="293.94849999999997" y1="198" x2="526.843" y2="198" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="410.39574999999996" y="188" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">May this attempt commit this partition?</text>
</g>
<g class="message" data-from="C" data-to="E" data-label="Permission only" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="526.843" y1="238" x2="293.94849999999997" y2="238" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="410.39574999999996" y="228" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Permission only</text>
</g>
<g class="message" data-from="E" data-to="H" data-label="Commit task output if needed and permitted" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="293.94849999999997" y1="278" x2="770.1115" y2="278" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="532.03" y="268" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Commit task output if needed and permitted</text>
</g>
<g class="message" data-from="E" data-to="D" data-label="Map of absolute files and set of touched directories" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="293.94849999999997" y1="318" x2="91.8055" y2="318" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="192.87699999999998" y="308" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Map of absolute files and set of touched directories</text>
</g>
<g class="message" data-from="D" data-to="H" data-label="Hadoop commitJob" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="91.8055" y1="358" x2="770.1115" y2="358" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="430.95849999999996" y="348" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Hadoop commitJob</text>
</g>
<g class="message" data-from="D" data-to="H" data-label="Replace touched directories from Spark staging, then clean staging" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="91.8055" y1="398" x2="770.1115" y2="398" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="430.95849999999996" y="388" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Replace touched directories from Spark staging, then clean staging</text>
</g>
<g class="actor" data-id="D" data-label="Driver protocol" data-type="participant">
  <rect x="29.999999999999993" y="30" width="123.611" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="91.8055" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Driver protocol</text>
</g>
<g class="actor" data-id="E" data-label="Executor writer and protocol" data-type="participant">
  <rect x="193.61099999999996" y="30" width="200.675" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="293.94849999999997" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Executor writer and protocol</text>
</g>
<g class="actor" data-id="C" data-label="Driver commit coordinator" data-type="participant">
  <rect x="434.28599999999994" y="30" width="185.11399999999998" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="526.843" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Driver commit coordinator</text>
</g>
<g class="actor" data-id="H" data-label="Hadoop committer and filesystem" data-type="participant">
  <rect x="659.4" y="30" width="221.42299999999997" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="770.1115" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Hadoop committer and filesystem</text>
</g>
</svg>