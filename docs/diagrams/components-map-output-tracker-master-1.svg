  <text x="382.97875" y="160" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">registerMapOutput(7, mapIndex 3, status)</text>
</g>
<g class="message" data-from="W" data-to="M" data-label="GetMapOutputStatuses(7)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="669.7059999999999" y1="210" x2="463.48749999999995" y2="210" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
