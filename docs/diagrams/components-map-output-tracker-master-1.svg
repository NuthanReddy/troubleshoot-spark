</g>
<g class="actor" data-id="W" data-label="Tracker worker on executor B" data-type="participant">
  <rect x="563.0699999999999" y="30" width="213.27199999999996" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="669.7059999999999" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Tracker worker on executor B</text>
</g>
