</g>
<g class="note" data-position="over" data-actors="W">
  <polygon points="532.4379999999999,258 800.9739999999998,258 806.9739999999998,264 806.9739999999998,281 532.4379999999999,281" fill="var(--bg)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="800.9739999999998,258 806.9739999999998,264 800.9739999999998,264" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="669.7059999999999" y="269.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">The reader fetches data from the address in the status</text>
</g>
