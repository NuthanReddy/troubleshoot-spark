<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 915.86 445" width="915.86" height="445" style="--bg:#101d2e;--fg:#ecf3f8;--line:#839ab5;--accent:#93e3d1;background:var(--bg)">
<style>
  text { font-family: 'system-ui', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="C" x1="87.3595" y1="70" x2="87.3595" y2="415" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="F" x1="258.01" y1="70" x2="258.01" y2="415" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="L" x1="428.28999999999996" y1="70" x2="428.28999999999996" y2="415" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="R" x1="600.0519999999999" y1="70" x2="600.0519999999999" y2="415" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="K" x1="800.3425" y1="70" x2="800.3425" y2="415" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="C" data-to="F" data-label="Load app and attempt" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="87.3595" y1="90" x2="258.01" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="172.68475" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Load app and attempt</text>
</g>
<g class="message" data-from="F" data-to="L" data-label="Open ordered segments and decompress if necessary" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="258.01" y1="145" x2="428.28999999999996" y2="145" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="343.15" y="135" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Open ordered segments and decompress if necessary</text>
</g>
<g class="message" data-from="L" data-to="R" data-label="One JSON event per line" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="428.28999999999996" y1="185" x2="600.0519999999999" y2="185" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="514.1709999999999" y="175" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">One JSON event per line</text>
</g>
<g class="message" data-from="R" data-to="K" data-label="Invoke replay status listeners to update records" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="600.0519999999999" y1="225" x2="800.3425" y2="225" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="700.1972499999999" y="215" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Invoke replay status listeners to update records</text>
</g>
<g class="message" data-from="F" data-to="K" data-label="Flush replay state for reads" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="258.01" y1="265" x2="800.3425" y2="265" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="529.17625" y="255" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Flush replay state for reads</text>
</g>
<g class="message" data-from="F" data-to="C" data-label="SparkUI with this store and no SparkContext" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="258.01" y1="305" x2="87.3595" y2="305" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="172.68475" y="295" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">SparkUI with this store and no SparkContext</text>
</g>
<g class="message" data-from="C" data-to="C" data-label="Attach handlers under the history server" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="87.3595,345 117.3595,345 117.3595,365 87.3595,365" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="125.3595" y="355" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Attach handlers under the history server</text>
</g>
<g class="note" data-position="over" data-actors="F,K">
  <polygon points="481.00825,98 571.34425,98 577.34425,104 577.34425,121 481.00825,121" fill="var(--bg)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="571.34425,98 577.34425,104 571.34425,104" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="529.17625" y="109.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">On a store miss</text>
</g>
<g class="actor" data-id="C" data-label="Attempt cache" data-type="participant">
  <rect x="29.999999999999993" y="30" width="114.71900000000001" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="87.3595" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Attempt cache</text>
</g>
<g class="actor" data-id="F" data-label="FsHistoryProvider" data-type="participant">
  <rect x="184.719" y="30" width="146.582" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="258.01" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">FsHistoryProvider</text>
</g>
<g class="actor" data-id="L" data-label="Event log files" data-type="participant">
  <rect x="371.301" y="30" width="113.978" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="428.28999999999996" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Event log files</text>
</g>
<g class="actor" data-id="R" data-label="ReplayListenerBus" data-type="participant">
  <rect x="525.2789999999999" y="30" width="149.546" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="600.0519999999999" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">ReplayListenerBus</text>
</g>
<g class="actor" data-id="K" data-label="Per-attempt status store" data-type="participant">
  <rect x="714.8249999999999" y="30" width="171.035" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="800.3425" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Per-attempt status store</text>
</g>
</svg>