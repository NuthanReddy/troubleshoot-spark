<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1294.1104999999998 530" width="1294.1104999999998" height="530" style="--bg:#101d2e;--fg:#ecf3f8;--line:#839ab5;--accent:#93e3d1;background:var(--bg)">
<style>
  text { font-family: 'system-ui', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="T" x1="99.21549999999999" y1="70" x2="99.21549999999999" y2="500" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="D" x1="269.866" y1="70" x2="269.866" y2="500" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Q" x1="464.22849999999994" y1="70" x2="464.22849999999994" y2="500" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="L" x1="664.5189999999999" y1="70" x2="664.5189999999999" y2="500" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="S" x1="838.1334999999999" y1="70" x2="838.1334999999999" y2="500" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="F" x1="1009.1544999999999" y1="70" x2="1009.1544999999999" y2="500" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="T" data-to="D" data-label="taskEnded with reason, result, accumulators and TaskInfo" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="99.21549999999999" y1="90" x2="269.866" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="184.54075" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">taskEnded with reason, result, accumulators and TaskInfo</text>
</g>
<g class="message" data-from="D" data-to="Q" data-label="Enqueue CompletionEvent" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="269.866" y1="130" x2="464.22849999999994" y2="130" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="367.04724999999996" y="120" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Enqueue CompletionEvent</text>
</g>
<g class="message" data-from="Q" data-to="Q" data-label="Handle task completion" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="464.22849999999994,170 494.22849999999994,170 494.22849999999994,190 464.22849999999994,190" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="502.22849999999994" y="180" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Handle task completion</text>
</g>
<g class="message" data-from="Q" data-to="L" data-label="Post SparkListenerTaskEnd" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="464.22849999999994" y1="240" x2="664.5189999999999" y2="240" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="564.37375" y="230" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Post SparkListenerTaskEnd</text>
</g>
<g class="message" data-from="L" data-to="S" data-label="Offer event" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="664.5189999999999" y1="280" x2="838.1334999999999" y2="280" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="751.3262499999998" y="270" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Offer event</text>
</g>
<g class="message" data-from="L" data-to="F" data-label="Offer event if queue exists" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="664.5189999999999" y1="320" x2="1009.1544999999999" y2="320" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="836.8367499999999" y="310" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Offer event if queue exists</text>
</g>
<g class="message" data-from="S" data-to="S" data-label="Invoke status listeners on its dispatch thread" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="838.1334999999999,360 868.1334999999999,360 868.1334999999999,380 838.1334999999999,380" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="876.1334999999999" y="370" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Invoke status listeners on its dispatch thread</text>
</g>
<g class="message" data-from="F" data-to="F" data-label="Invoke log listener on its own dispatch thread" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="1009.1544999999999,430 1039.1544999999999,430 1039.1544999999999,450 1009.1544999999999,450" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="1047.1544999999999" y="440" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Invoke log listener on its own dispatch thread</text>
</g>
<g class="actor" data-id="T" data-label="TaskSetManager" data-type="participant">
  <rect x="30" y="30" width="138.43099999999998" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="99.21549999999999" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">TaskSetManager</text>
</g>
<g class="actor" data-id="D" data-label="DAGScheduler" data-type="participant">
  <rect x="208.43099999999998" y="30" width="122.87" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="269.866" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">DAGScheduler</text>
</g>
<g class="actor" data-id="Q" data-label="DAG scheduler event loop" data-type="participant">
  <rect x="371.301" y="30" width="185.85499999999993" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="464.22849999999994" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">DAG scheduler event loop</text>
</g>
<g class="actor" data-id="L" data-label="LiveListenerBus" data-type="participant">
  <rect x="597.156" y="30" width="134.726" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="664.5189999999999" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">LiveListenerBus</text>
</g>
<g class="actor" data-id="S" data-label="appStatus queue" data-type="participant">
  <rect x="771.882" y="30" width="132.503" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="838.1334999999999" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">appStatus queue</text>
</g>
<g class="actor" data-id="F" data-label="eventLog queue" data-type="participant">
  <rect x="944.3849999999999" y="30" width="129.539" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="1009.1544999999999" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">eventLog queue</text>
</g>
</svg>