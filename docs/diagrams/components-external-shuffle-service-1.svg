<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890.0749999999999 525" width="890.0749999999999" height="525" style="--bg:#101d2e;--fg:#ecf3f8;--line:#839ab5;--accent:#93e3d1;background:var(--bg)">
<style>
  text { font-family: 'system-ui', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="N" x1="161.45949999999996" y1="70" x2="161.45949999999996" y2="495" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="E" x1="408.80349999999993" y1="70" x2="408.80349999999993" y2="495" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="R" x1="597.6084999999999" y1="70" x2="597.6084999999999" y2="495" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="D" x1="785.3019999999999" y1="70" x2="785.3019999999999" y2="495" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="N" data-to="N" data-label="serviceInit starts the shuffle transport server" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="161.45949999999996,90 191.45949999999996,90 191.45949999999996,110 161.45949999999996,110" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="199.45949999999996" y="100" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">serviceInit starts the shuffle transport server</text>
</g>
<g class="message" data-from="E" data-to="N" data-label="RegisterExecutor(appId, execId, ExecutorShuffleInfo)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="408.80349999999993" y1="160" x2="161.45949999999996" y2="160" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="285.13149999999996" y="150" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">RegisterExecutor(appId, execId, ExecutorShuffleInfo)</text>
</g>
<g class="message" data-from="N" data-to="E" data-label="Registration acknowledgment" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="161.45949999999996" y1="200" x2="408.80349999999993" y2="200" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="285.13149999999996" y="190" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Registration acknowledgment</text>
</g>
<g class="message" data-from="E" data-to="D" data-label="Commit shuffle data and index" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="408.80349999999993" y1="240" x2="785.3019999999999" y2="240" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="597.05275" y="230" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Commit shuffle data and index</text>
</g>
<g class="message" data-from="R" data-to="N" data-label="FetchShuffleBlocks for one shuffle and selected map and reduce IDs" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="597.6084999999999" y1="295" x2="161.45949999999996" y2="295" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="379.53399999999993" y="285" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">FetchShuffleBlocks for one shuffle and selected map and reduce IDs</text>
</g>
<g class="message" data-from="N" data-to="R" data-label="StreamHandle(streamId, numChunks)" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="161.45949999999996" y1="335" x2="597.6084999999999" y2="335" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="379.53399999999993" y="325" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">StreamHandle(streamId, numChunks)</text>
</g>
<g class="message" data-from="R" data-to="N" data-label="Request chunks from that stream" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="597.6084999999999" y1="375" x2="161.45949999999996" y2="375" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="379.53399999999993" y="365" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Request chunks from that stream</text>
</g>
<g class="message" data-from="N" data-to="D" data-label="Resolve index offsets and read file segment" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="161.45949999999996" y1="415" x2="785.3019999999999" y2="415" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="473.3807499999999" y="405" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Resolve index offsets and read file segment</text>
</g>
<g class="message" data-from="N" data-to="R" data-label="Requested shuffle bytes" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="161.45949999999996" y1="455" x2="597.6084999999999" y2="455" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="379.53399999999993" y="445" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Requested shuffle bytes</text>
</g>
<g class="note" data-position="over" data-actors="R">
  <polygon points="436.58050000000003,248 752.6364999999998,248 758.6364999999998,254 758.6364999999998,271 436.58050000000003,271" fill="var(--bg)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="752.6364999999998,248 758.6364999999998,254 752.6364999999998,254" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="597.6084999999999" y="259.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Tracker supplies origin execId, host, service port and block IDs</text>
</g>
<g class="actor" data-id="N" data-label="NodeManager and YarnShuffleService" data-type="participant">
  <rect x="30" y="30" width="262.9189999999999" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="161.45949999999996" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">NodeManager and YarnShuffleService</text>
</g>
<g class="actor" data-id="E" data-label="Producing executor" data-type="participant">
  <rect x="332.9189999999999" y="30" width="151.769" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="408.80349999999993" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Producing executor</text>
</g>
<g class="actor" data-id="R" data-label="Reducing executor" data-type="participant">
  <rect x="524.6879999999999" y="30" width="145.841" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="597.6084999999999" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Reducing executor</text>
</g>
<g class="actor" data-id="D" data-label="Producer local disk" data-type="participant">
  <rect x="710.5289999999999" y="30" width="149.546" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="785.3019999999999" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Producer local disk</text>
</g>
</svg>