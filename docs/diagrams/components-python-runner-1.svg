<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 668.4559999999999 540" width="668.4559999999999" height="540" style="--bg:#101d2e;--fg:#ecf3f8;--line:#839ab5;--accent:#93e3d1;background:var(--bg)">
<style>
  text { font-family: 'system-ui', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="T" x1="108.47800000000001" y1="70" x2="108.47800000000001" y2="510" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="R" x1="327.664" y1="70" x2="327.664" y2="510" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="W" x1="524.9905" y1="70" x2="524.9905" y2="510" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="T" data-to="R" data-label="compute(parent iterator, 7, TaskContext)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="108.47800000000001" y1="90" x2="327.664" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="218.071" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">compute(parent iterator, 7, TaskContext)</text>
</g>
<g class="message" data-from="R" data-to="R" data-label="Acquire worker, then arm completion listener and monitor" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="327.664,130 357.664,130 357.664,150 327.664,150" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="365.664" y="140" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Acquire worker, then arm completion listener and monitor</text>
</g>
<g class="message" data-from="R" data-to="T" data-label="Interruptible output iterator" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="327.664" y1="200" x2="108.47800000000001" y2="200" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="218.071" y="190" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Interruptible output iterator</text>
</g>
<g class="message" data-from="T" data-to="R" data-label="Pull next output" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="108.47800000000001" y1="240" x2="327.664" y2="240" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="218.071" y="230" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Pull next output</text>
</g>
<g class="message" data-from="R" data-to="W" data-label="Init frame, then serialized parent input as writable" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="327.664" y1="280" x2="524.9905" y2="280" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="426.32725" y="270" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Init frame, then serialized parent input as writable</text>
</g>
<g class="message" data-from="W" data-to="R" data-label="Init response, then result frames as available" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="524.9905" y1="320" x2="327.664" y2="320" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="426.32725" y="310" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Init response, then result frames as available</text>
</g>
<g class="message" data-from="R" data-to="T" data-label="Next output batch" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="327.664" y1="360" x2="108.47800000000001" y2="360" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="218.071" y="350" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Next output batch</text>
</g>
<g class="message" data-from="W" data-to="R" data-label="Metrics, end-of-data, accumulator updates, finish reply" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="524.9905" y1="400" x2="327.664" y2="400" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="426.32725" y="390" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Metrics, end-of-data, accumulator updates, finish reply</text>
</g>
<g class="message" data-from="R" data-to="R" data-label="Release once if reusable" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="327.664,440 357.664,440 357.664,460 327.664,460" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="365.664" y="450" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Release once if reusable</text>
</g>
<g class="actor" data-id="T" data-label="Executor task thread" data-type="participant">
  <rect x="30" y="30" width="156.95600000000002" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="108.47800000000001" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Executor task thread</text>
</g>
<g class="actor" data-id="R" data-label="Runner and its output iterator" data-type="participant">
  <rect x="226.95600000000002" y="30" width="201.41599999999994" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="327.664" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Runner and its output iterator</text>
</g>
<g class="actor" data-id="W" data-label="Local worker" data-type="participant">
  <rect x="468.372" y="30" width="113.23700000000001" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="524.9905" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Local worker</text>
</g>
</svg>