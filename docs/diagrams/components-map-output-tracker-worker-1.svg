<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 723.867 487" width="723.867" height="487" style="--bg:#101d2e;--fg:#ecf3f8;--line:#839ab5;--accent:#93e3d1;background:var(--bg)">
<style>
  text { font-family: 'system-ui', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<g class="block" data-type="alt" data-label="Status array absent">
  <rect x="281.423" y="118" width="412.44399999999996" height="210" rx="0" ry="0" fill="none" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="281.423" y="118" width="141.07000000000002" height="18" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="287.423" y="127" font-size="11" font-weight="600" fill="var(--_text-sec)" dy="3.8499999999999996">alt [Status array absent]</text>
  <line x1="281.423" y1="381" x2="693.867" y2="381" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
  <text x="289.423" y="395" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">[Status array present]</text>
</g>
<line class="lifeline" data-actor="R" x1="140.7115" y1="70" x2="140.7115" y2="457" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="W" x1="381.757" y1="70" x2="381.757" y2="457" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="D" x1="597.979" y1="70" x2="597.979" y2="457" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="R" data-to="W" data-label="getMapSizesByExecutorId with map and reduce ranges" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="140.7115" y1="90" x2="381.757" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="261.23425" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">getMapSizesByExecutorId with map and reduce ranges</text>
</g>
<g class="message" data-from="W" data-to="W" data-label="Lock by shuffle ID and check cache again" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="381.757,158 411.757,158 411.757,178 381.757,178" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="419.757" y="168" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Lock by shuffle ID and check cache again</text>
</g>
<g class="message" data-from="W" data-to="D" data-label="GetMapOutputStatuses(shuffleId)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="381.757" y1="228" x2="597.979" y2="228" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="489.86800000000005" y="218" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">GetMapOutputStatuses(shuffleId)</text>
</g>
<g class="message" data-from="D" data-to="W" data-label="Status snapshot or broadcast reference" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="597.979" y1="268" x2="381.757" y2="268" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="489.86800000000005" y="258" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Status snapshot or broadcast reference</text>
</g>
<g class="message" data-from="W" data-to="W" data-label="Deserialize and cache full map status array" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="381.757,308 411.757,308 411.757,328 381.757,328" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="419.757" y="318" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Deserialize and cache full map status array</text>
</g>
<g class="message" data-from="W" data-to="R" data-label="Nonempty blocks grouped by serving address" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="381.757" y1="417" x2="140.7115" y2="417" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="261.23425" y="407" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Nonempty blocks grouped by serving address</text>
</g>
<g class="note" data-position="over" data-actors="W">
  <polygon points="301.51300000000003,346 456.00100000000003,346 462.00100000000003,352 462.00100000000003,369 301.51300000000003,369" fill="var(--bg)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="456.00100000000003,346 462.00100000000003,352 456.00100000000003,352" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="381.75700000000006" y="357.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">No driver RPC for this lookup</text>
</g>
<g class="actor" data-id="R" data-label="SortShuffleManager on reducer" data-type="participant">
  <rect x="30" y="30" width="221.423" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="140.7115" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">SortShuffleManager on reducer</text>
</g>
<g class="actor" data-id="W" data-label="Executor tracker worker" data-type="participant">
  <rect x="291.423" y="30" width="180.668" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="381.757" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Executor tracker worker</text>
</g>
<g class="actor" data-id="D" data-label="Driver tracker endpoint" data-type="participant">
  <rect x="512.0910000000001" y="30" width="171.77599999999995" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="597.979" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Driver tracker endpoint</text>
</g>
</svg>