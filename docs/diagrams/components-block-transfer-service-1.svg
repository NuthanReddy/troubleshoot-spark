</g>
<g class="actor" data-id="D" data-label="Driver directory" data-type="participant">
  <rect x="258.81899999999996" y="30" width="129.539" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="323.58849999999995" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Driver directory</text>
</g>
<g class="actor" data-id="N" data-label="Executor 2 Netty server" data-type="participant">
  <rect x="428.35799999999995" y="30" width="173.999" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="515.3575" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Executor 2 Netty server</text>
</g>
<g class="actor" data-id="S" data-label="Executor 2 local BlockManager" data-type="participant">
  <rect x="642.357" y="30" width="219.20000000000002" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="751.957" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Executor 2 local BlockManager</text>
</g>
</svg>