  <text x="633.65725" y="240" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">ManagedBuffer</text>
</g>
<g class="message" data-from="N" data-to="C" data-label="StreamHandle(stream ID, chunk count)" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="515.3575" y1="290" x2="124.4095" y2="290" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="319.88349999999997" y="280" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">StreamHandle(stream ID, chunk count)</text>
</g>
<g class="message" data-from="C" data-to="N" data-label="Fetch chunk(stream ID, index)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="124.4095" y1="330" x2="515.3575" y2="330" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="319.88349999999997" y="320" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Fetch chunk(stream ID, index)</text>
</g>
<g class="message" data-from="N" data-to="C" data-label="Serialized piece bytes" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="515.3575" y1="370" x2="124.4095" y2="370" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="319.88349999999997" y="360" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Serialized piece bytes</text>
</g>
<g class="actor" data-id="C" data-label="Executor 5 BlockManager" data-type="participant">
  <rect x="30" y="30" width="188.819" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
