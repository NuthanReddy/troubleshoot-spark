<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 891.557 440" width="891.557" height="440" style="--bg:#101d2e;--fg:#ecf3f8;--line:#839ab5;--accent:#93e3d1;background:var(--bg)">
<style>
  text { font-family: 'system-ui', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="C" x1="124.4095" y1="70" x2="124.4095" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="D" x1="323.58849999999995" y1="70" x2="323.58849999999995" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="N" x1="515.3575" y1="70" x2="515.3575" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="S" x1="751.957" y1="70" x2="751.957" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="C" data-to="D" data-label="GetLocationsAndStatus(block ID, requester host)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="124.4095" y1="90" x2="323.58849999999995" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="223.99899999999997" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">GetLocationsAndStatus(block ID, requester host)</text>
</g>
<g class="message" data-from="D" data-to="C" data-label="Candidate IDs, host, port, status" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="323.58849999999995" y1="130" x2="124.4095" y2="130" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="223.99899999999997" y="120" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Candidate IDs, host, port, status</text>
</g>
<g class="message" data-from="C" data-to="N" data-label="OpenBlocks(app ID, executor ID, block IDs)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="124.4095" y1="170" x2="515.3575" y2="170" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="319.88349999999997" y="160" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">OpenBlocks(app ID, executor ID, block IDs)</text>
</g>
<g class="message" data-from="N" data-to="S" data-label="getLocalBlockData(block ID) inside JVM" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="515.3575" y1="210" x2="751.957" y2="210" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="633.65725" y="200" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">getLocalBlockData(block ID) inside JVM</text>
</g>
<g class="message" data-from="S" data-to="N" data-label="ManagedBuffer" data-line-style="dashed" data-arrow-head="filled" data-self="false">
