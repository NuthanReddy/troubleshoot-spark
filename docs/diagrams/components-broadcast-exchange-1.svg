<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880.342 405" width="880.342" height="405" style="--bg:#101d2e;--fg:#ecf3f8;--line:#839ab5;--accent:#93e3d1;background:var(--bg)">
<style>
  text { font-family: 'system-ui', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="X" x1="96.9925" y1="70" x2="96.9925" y2="375" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="B" x1="295.4305" y1="70" x2="295.4305" y2="375" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="S" x1="526.843" y1="70" x2="526.843" y2="375" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="J" x1="740.1009999999999" y1="70" x2="740.1009999999999" y2="375" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="X" data-to="B" data-label="Collect regions via a Spark job" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="96.9925" y1="90" x2="295.4305" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="196.2115" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Collect regions via a Spark job</text>
</g>
<g class="message" data-from="B" data-to="X" data-label="Partition row counts and encoded rows" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="295.4305" y1="130" x2="96.9925" y2="130" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="196.2115" y="120" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Partition row counts and encoded rows</text>
</g>
<g class="message" data-from="X" data-to="X" data-label="Transform build keys and rows into HashedRelation" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="96.9925,170 126.9925,170 126.9925,190 96.9925,190" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="134.9925" y="180" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Transform build keys and rows into HashedRelation</text>
</g>
<g class="message" data-from="X" data-to="S" data-label="broadcastInternal(relation, serializedOnly = true)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="96.9925" y1="240" x2="526.843" y2="240" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="311.91774999999996" y="230" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">broadcastInternal(relation, serializedOnly = true)</text>
</g>
<g class="message" data-from="S" data-to="X" data-label="Broadcast handle" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="526.843" y1="280" x2="96.9925" y2="280" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="311.91774999999996" y="270" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Broadcast handle</text>
</g>
<g class="message" data-from="J" data-to="S" data-label="Resolve handle.value when needed" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="740.1009999999999" y1="320" x2="526.843" y2="320" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="633.472" y="310" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Resolve handle.value when needed</text>
</g>
<g class="note" data-position="over" data-actors="J">
  <polygon points="629.8599999999999,328 844.342,328 850.342,334 850.342,351 629.8599999999999,351" fill="var(--bg)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="844.342,328 850.342,334 844.342,334" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="740.1009999999999" y="339.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">The join, not the exchange, probes orders</text>
</g>
<g class="actor" data-id="X" data-label="Driver exchange" data-type="participant">
  <rect x="30" y="30" width="133.985" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="96.9925" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Driver exchange</text>
</g>
<g class="actor" data-id="B" data-label="Build-side executor tasks" data-type="participant">
  <rect x="203.985" y="30" width="182.891" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="295.4305" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Build-side executor tasks</text>
</g>
<g class="actor" data-id="S" data-label="Spark broadcast subsystem" data-type="participant">
  <rect x="426.876" y="30" width="199.93399999999997" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="526.843" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Spark broadcast subsystem</text>
</g>
<g class="actor" data-id="J" data-label="Streamed-side task" data-type="participant">
  <rect x="666.81" y="30" width="146.582" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="740.1009999999999" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Streamed-side task</text>
</g>
</svg>