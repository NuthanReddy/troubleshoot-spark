<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 928.457 440" width="928.457" height="440" style="--bg:#101d2e;--fg:#ecf3f8;--line:#839ab5;--accent:#93e3d1;background:var(--bg)">
<style>
  text { font-family: 'system-ui', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="S" x1="111.81249999999999" y1="70" x2="111.81249999999999" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="C" x1="305.80449999999996" y1="70" x2="305.80449999999996" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="A" x1="482.7535" y1="70" x2="482.7535" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="B" x1="654.5155" y1="70" x2="654.5155" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="H" x1="829.9825" y1="70" x2="829.9825" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="S" data-to="C" data-label="stageStart(17, maxPartitionId)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="111.81249999999999" y1="90" x2="305.80449999999996" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="208.80849999999998" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">stageStart(17, maxPartitionId)</text>
</g>
<g class="message" data-from="A" data-to="C" data-label="canCommit(17, 0, 7, 1)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="482.7535" y1="130" x2="305.80449999999996" y2="130" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="394.279" y="120" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">canCommit(17, 0, 7, 1)</text>
</g>
<g class="message" data-from="C" data-to="A" data-label="true, owner for partition 7 is (0, 1)" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="305.80449999999996" y1="170" x2="482.7535" y2="170" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="394.279" y="160" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">true, owner for partition 7 is (0, 1)</text>
</g>
<g class="message" data-from="B" data-to="C" data-label="canCommit(17, 0, 7, 0)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="654.5155" y1="210" x2="305.80449999999996" y2="210" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="480.15999999999997" y="200" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">canCommit(17, 0, 7, 0)</text>
</g>
<g class="message" data-from="C" data-to="B" data-label="false, slot already occupied" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="305.80449999999996" y1="250" x2="654.5155" y2="250" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="480.15999999999997" y="240" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">false, slot already occupied</text>
</g>
<g class="message" data-from="B" data-to="H" data-label="Abort A0 attempt output" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="654.5155" y1="290" x2="829.9825" y2="290" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="742.249" y="280" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Abort A0 attempt output</text>
</g>
<g class="message" data-from="A" data-to="H" data-label="Commit A1 attempt output" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="482.7535" y1="330" x2="829.9825" y2="330" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="656.3679999999999" y="320" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Commit A1 attempt output</text>
</g>
<g class="message" data-from="S" data-to="C" data-label="taskCompleted for each attempt" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="111.81249999999999" y1="370" x2="305.80449999999996" y2="370" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="208.80849999999998" y="360" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">taskCompleted for each attempt</text>
</g>
<g class="actor" data-id="S" data-label="Driver DAGScheduler" data-type="participant">
  <rect x="30" y="30" width="163.62499999999997" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="111.81249999999999" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Driver DAGScheduler</text>
</g>
<g class="actor" data-id="C" data-label="Driver coordinator" data-type="participant">
  <rect x="233.62499999999994" y="30" width="144.359" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="305.80449999999996" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Driver coordinator</text>
</g>
<g class="actor" data-id="A" data-label="A1 on executor B" data-type="participant">
  <rect x="417.984" y="30" width="129.539" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="482.7535" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">A1 on executor B</text>
</g>
<g class="actor" data-id="B" data-label="A0 on executor A" data-type="participant">
  <rect x="587.5229999999999" y="30" width="133.985" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="654.5155" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">A0 on executor A</text>
</g>
<g class="actor" data-id="H" data-label="Hadoop committer" data-type="participant">
  <rect x="761.5079999999999" y="30" width="136.949" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="829.9825" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Hadoop committer</text>
</g>
</svg>