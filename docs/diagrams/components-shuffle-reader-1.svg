  <rect x="392.423" y="158" width="246.66999999999996" height="18" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="398.423" y="167" font-size="11" font-weight="600" fill="var(--_text-sec)" dy="3.8499999999999996">alt [Same executor or eligible host-local disk]</text>
