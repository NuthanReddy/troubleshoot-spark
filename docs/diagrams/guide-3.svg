<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480.45199999999994 480" width="480.45199999999994" height="480" style="--bg:#101d2e;--fg:#ecf3f8;--line:#839ab5;--accent:#93e3d1;background:var(--bg)">
<style>
  text { font-family: 'system-ui', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="N" x1="89.5825" y1="70" x2="89.5825" y2="450" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="E" x1="249.118" y1="70" x2="249.118" y2="450" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="D" x1="399.76149999999996" y1="70" x2="399.76149999999996" y2="450" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="N" data-to="E" data-label="Start JVM with driver URL" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="89.5825" y1="90" x2="249.118" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="169.35025" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Start JVM with driver URL</text>
</g>
<g class="message" data-from="E" data-to="D" data-label="RetrieveSparkAppConfig using a temporary RPC client" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="249.118" y1="130" x2="399.76149999999996" y2="130" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="324.43975" y="120" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">RetrieveSparkAppConfig using a temporary RPC client</text>
</g>
<g class="message" data-from="D" data-to="E" data-label="Return settings and resource profile" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="399.76149999999996" y1="170" x2="249.118" y2="170" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="324.43975" y="160" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Return settings and resource profile</text>
</g>
<g class="message" data-from="E" data-to="D" data-label="RegisterExecutor with endpoint reference and resources" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="249.118" y1="210" x2="399.76149999999996" y2="210" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="324.43975" y="200" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">RegisterExecutor with endpoint reference and resources</text>
</g>
<g class="message" data-from="D" data-to="E" data-label="Accept registration" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="399.76149999999996" y1="250" x2="249.118" y2="250" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="324.43975" y="240" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Accept registration</text>
</g>
<g class="message" data-from="E" data-to="D" data-label="RegisterBlockManager with data host and port" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="249.118" y1="290" x2="399.76149999999996" y2="290" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="324.43975" y="280" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">RegisterBlockManager with data host and port</text>
</g>
<g class="message" data-from="E" data-to="D" data-label="LaunchedExecutor signals readiness" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="249.118" y1="330" x2="399.76149999999996" y2="330" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="324.43975" y="320" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">LaunchedExecutor signals readiness</text>
</g>
<g class="message" data-from="D" data-to="E" data-label="LaunchTask over executor-initiated RPC connection" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="399.76149999999996" y1="370" x2="249.118" y2="370" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="324.43975" y="360" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">LaunchTask over executor-initiated RPC connection</text>
</g>
<g class="message" data-from="E" data-to="D" data-label="StatusUpdate for this task attempt" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="249.118" y1="410" x2="399.76149999999996" y2="410" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="324.43975" y="400" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">StatusUpdate for this task attempt</text>
</g>
<g class="actor" data-id="N" data-label="NodeManager" data-type="participant">
  <rect x="30" y="30" width="119.16499999999999" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="89.5825" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">NodeManager</text>
</g>
<g class="actor" data-id="E" data-label="Executor JVM" data-type="participant">
  <rect x="189.165" y="30" width="119.90599999999999" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="249.118" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Executor JVM</text>
</g>
<g class="actor" data-id="D" data-label="Driver RPC" data-type="participant">
  <rect x="349.07099999999997" y="30" width="101.381" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="399.76149999999996" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Driver RPC</text>
</g>
</svg>