<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 835.9820000000001 350" width="835.9820000000001" height="350" style="--bg:#101d2e;--fg:#ecf3f8;--line:#839ab5;--accent:#93e3d1;background:var(--bg)">
<style>
  text { font-family: 'system-ui', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="R" x1="122.557" y1="70" x2="122.557" y2="320" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="A" x1="328.40500000000003" y1="70" x2="328.40500000000003" y2="320" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="N" x1="528.325" y1="70" x2="528.325" y2="320" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="B" x1="730.4680000000001" y1="70" x2="730.4680000000001" y2="320" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="A" data-to="R" data-label="Attempt lost without successful completion" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="328.40500000000003" y1="90" x2="122.557" y2="90" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="225.48100000000002" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Attempt lost without successful completion</text>
</g>
<g class="message" data-from="R" data-to="R" data-label="Check attempt policy and remaining budget" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="122.557,130 152.55700000000002,130 152.55700000000002,150 122.557,150" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="160.55700000000002" y="140" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Check attempt policy and remaining budget</text>
</g>
<g class="message" data-from="R" data-to="N" data-label="Launch a new AM container" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="122.557" y1="200" x2="528.325" y2="200" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="325.44100000000003" y="190" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Launch a new AM container</text>
</g>
<g class="message" data-from="N" data-to="B" data-label="Start new JVM and user script" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="528.325" y1="240" x2="730.4680000000001" y2="240" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="629.3965000000001" y="230" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Start new JVM and user script</text>
</g>
<g class="message" data-from="B" data-to="R" data-label="Register new attempt for the same application" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="730.4680000000001" y1="280" x2="122.557" y2="280" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="426.51250000000005" y="270" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Register new attempt for the same application</text>
</g>
<g class="actor" data-id="R" data-label="YARN ResourceManager" data-type="participant">
  <rect x="30" y="30" width="185.114" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="122.557" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">YARN ResourceManager</text>
</g>
<g class="actor" data-id="A" data-label="AM / driver attempt 1" data-type="participant">
  <rect x="255.11400000000003" y="30" width="146.582" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="328.40500000000003" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">AM / driver attempt 1</text>
</g>
<g class="actor" data-id="N" data-label="Selected NodeManager" data-type="participant">
  <rect x="441.696" y="30" width="173.25799999999998" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="528.325" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Selected NodeManager</text>
</g>
<g class="actor" data-id="B" data-label="AM / driver attempt 2" data-type="participant">
  <rect x="654.9540000000001" y="30" width="151.02800000000002" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="730.4680000000001" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">AM / driver attempt 2</text>
</g>
</svg>