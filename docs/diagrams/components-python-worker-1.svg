  <text x="256.528" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Worker main</text>
</g>
<g class="actor" data-id="F" data-label="Partition function" data-type="participant">
  <rect x="350.553" y="30" width="131.02100000000002" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="416.06350000000003" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Partition function</text>
</g>
</svg>