  <line x1="256.528" y1="290" x2="96.2515" y2="290" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="176.38975" y="280" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Serialized output, then metrics and accumulator section</text>
</g>
<g class="message" data-from="W" data-to="W" data-label="Verify the input finish marker" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="256.528,330 286.528,330 286.528,350 256.528,350" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="294.528" y="340" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Verify the input finish marker</text>
</g>
<g class="message" data-from="W" data-to="J" data-label="END_OF_STREAM if ready for reuse" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="256.528" y1="400" x2="96.2515" y2="400" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="176.38975" y="390" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">END_OF_STREAM if ready for reuse</text>
</g>
<g class="actor" data-id="J" data-label="Executor runner" data-type="participant">
  <rect x="30" y="30" width="132.503" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="96.2515" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Executor runner</text>
</g>
