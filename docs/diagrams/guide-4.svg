  <text x="546.1089999999999" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Reduce executor B</text>
</g>
<g class="actor" data-id="S" data-label="HDFS" data-type="participant">
  <rect x="659.3999999999999" y="30" width="80" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="699.3999999999999" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">HDFS</text>
</g>
</svg>