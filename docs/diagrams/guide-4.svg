  <text x="258.82599999999996" y="270" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Task finishes with MapStatus and partition sizes</text>
</g>
<g class="message" data-from="D" data-to="B" data-label="Launch task for reduce partition 3" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="148.1215" y1="320" x2="546.1089999999999" y2="320" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="347.11524999999995" y="310" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Launch task for reduce partition 3</text>
</g>
<g class="message" data-from="B" data-to="D" data-label="GetMapOutputStatuses if not already cached" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="546.1089999999999" y1="360" x2="148.1215" y2="360" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="347.11524999999995" y="350" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">GetMapOutputStatuses if not already cached</text>
</g>
<g class="message" data-from="D" data-to="B" data-label="Locations and size metadata" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="148.1215" y1="400" x2="546.1089999999999" y2="400" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="347.11524999999995" y="390" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Locations and size metadata</text>
</g>
<g class="message" data-from="B" data-to="A" data-label="FetchShuffleBlocks at worker-a:42001" data-line-style="solid" data-arrow-head="filled" data-self="false">
