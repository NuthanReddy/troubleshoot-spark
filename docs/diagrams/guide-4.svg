  <text x="457.81974999999994" y="430" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">FetchShuffleBlocks at worker-a:42001</text>
</g>
<g class="message" data-from="A" data-to="B" data-label="Stream handle" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="369.53049999999996" y1="480" x2="546.1089999999999" y2="480" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="457.81974999999994" y="470" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Stream handle</text>
</g>
<g class="message" data-from="B" data-to="A" data-label="Request chunks for the required partition" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="546.1089999999999" y1="520" x2="369.53049999999996" y2="520" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="457.81974999999994" y="510" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Request chunks for the required partition</text>
</g>
<g class="message" data-from="A" data-to="B" data-label="Shuffle bytes directly to worker-b" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="369.53049999999996" y1="560" x2="546.1089999999999" y2="560" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="457.81974999999994" y="550" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Shuffle bytes directly to worker-b</text>
</g>
<g class="message" data-from="B" data-to="B" data-label="Finish counts by region" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="546.1089999999999,600 576.1089999999999,600 576.1089999999999,620 546.1089999999999,620" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="584.1089999999999" y="610" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Finish counts by region</text>
</g>
<g class="message" data-from="B" data-to="S" data-label="Write output partition" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="546.1089999999999" y1="670" x2="699.3999999999999" y2="670" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="622.7544999999999" y="660" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Write output partition</text>
</g>
<g class="message" data-from="B" data-to="D" data-label="Report task completion and commit information" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="546.1089999999999" y1="710" x2="148.1215" y2="710" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="347.11524999999995" y="700" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Report task completion and commit information</text>
</g>
<g class="actor" data-id="D" data-label="Driver / MapOutputTrackerMaster" data-type="participant">
  <rect x="30" y="30" width="236.243" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="148.1215" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Driver / MapOutputTrackerMaster</text>
</g>
<g class="actor" data-id="A" data-label="Map executor A" data-type="participant">
  <rect x="306.24299999999994" y="30" width="126.57500000000002" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="369.53049999999996" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Map executor A</text>
</g>
<g class="actor" data-id="B" data-label="Reduce executor B" data-type="participant">
