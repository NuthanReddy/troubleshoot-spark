<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 851.5429999999999 470" width="851.5429999999999" height="470" style="--bg:#101d2e;--fg:#ecf3f8;--line:#839ab5;--accent:#93e3d1;background:var(--bg)">
<style>
  text { font-family: 'system-ui', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="B" x1="103.291" y1="70" x2="103.291" y2="440" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="A" x1="298.765" y1="70" x2="298.765" y2="440" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="D" x1="505.7245" y1="70" x2="505.7245" y2="440" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="C" x1="726.0219999999999" y1="70" x2="726.0219999999999" y2="440" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="B" data-to="A" data-label="Fetch map output" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="103.291" y1="90" x2="298.765" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="201.028" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Fetch map output</text>
</g>
<g class="message" data-from="A" data-to="B" data-label="Output unavailable" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="298.765" y1="130" x2="103.291" y2="130" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="201.028" y="120" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Output unavailable</text>
</g>
<g class="message" data-from="B" data-to="D" data-label="FetchFailed for current stage attempt" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="103.291" y1="170" x2="505.7245" y2="170" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="304.50775" y="160" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">FetchFailed for current stage attempt</text>
</g>
<g class="message" data-from="D" data-to="D" data-label="Invalidate output and schedule stage recovery" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="505.7245,210 535.7245,210 535.7245,230 505.7245,230" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="543.7245" y="220" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Invalidate output and schedule stage recovery</text>
</g>
<g class="message" data-from="D" data-to="C" data-label="Recompute missing producer partition" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="505.7245" y1="280" x2="726.0219999999999" y2="280" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="615.87325" y="270" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Recompute missing producer partition</text>
</g>
<g class="message" data-from="C" data-to="D" data-label="MapStatus with new serving location" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="726.0219999999999" y1="320" x2="505.7245" y2="320" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="615.87325" y="310" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">MapStatus with new serving location</text>
</g>
<g class="message" data-from="D" data-to="B" data-label="Retry consumer on an available executor" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="505.7245" y1="360" x2="103.291" y2="360" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="304.50775" y="350" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Retry consumer on an available executor</text>
</g>
<g class="message" data-from="B" data-to="C" data-label="Fetch regenerated block" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="103.291" y1="400" x2="726.0219999999999" y2="400" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="414.65649999999994" y="390" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Fetch regenerated block</text>
</g>
<g class="actor" data-id="B" data-label="Reduce executor B" data-type="participant">
  <rect x="30" y="30" width="146.582" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="103.291" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Reduce executor B</text>
</g>
<g class="actor" data-id="A" data-label="Original shuffle server" data-type="participant">
  <rect x="216.582" y="30" width="164.366" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="298.765" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Original shuffle server</text>
</g>
<g class="actor" data-id="D" data-label="Driver / DAGScheduler" data-type="participant">
  <rect x="420.948" y="30" width="169.55299999999997" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="505.7245" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Driver / DAGScheduler</text>
</g>
<g class="actor" data-id="C" data-label="Replacement map executor" data-type="participant">
  <rect x="630.501" y="30" width="191.04199999999994" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="726.0219999999999" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Replacement map executor</text>
</g>
</svg>