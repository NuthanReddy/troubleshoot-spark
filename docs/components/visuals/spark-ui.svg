  <text font-size="18" fill="#223a40"><tspan x="62" y="326">The UI reads the</tspan><tspan x="62" y="349">selected stage attempt</tspan><tspan x="62" y="372">from the store and</tspan><tspan x="62" y="395">displays its task rows.</tspan></text>
</g>
