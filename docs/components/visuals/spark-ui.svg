  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="36">Status queue</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="61">Delivers task events to</tspan><tspan x="62" y="84">the status listener in the</tspan><tspan x="62" y="107">driver.</tspan></text>
  <rect x="48" y="131" width="302" height="134" rx="9" fill="#fff" stroke="#a8bdbb"/>
  <circle cx="24" cy="151" r="12" fill="#184d50"/>
  <text x="24" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">2</text>
  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="157">Status listener</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="182">The listener writes</tspan><tspan x="62" y="205">task-attempt records and</tspan><tspan x="62" y="228">updates stage counts in</tspan><tspan x="62" y="251">the driver&apos;s store.</tspan></text>
  <rect x="48" y="275" width="302" height="134" rx="9" fill="#fff" stroke="#a8bdbb"/>
