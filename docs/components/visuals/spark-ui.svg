<svg xmlns="http://www.w3.org/2000/svg" width="360" height="419" viewBox="0 0 360 419" role="img" aria-labelledby="flow-title" aria-describedby="flow-desc">
<title id="flow-title">Live Spark UI: reading the driver&apos;s status store: Flow at a glance</title>
<desc id="flow-desc">1. Status queue: Delivers task events to the status listener in the driver. 2. Status listener: The listener writes task-attempt records and updates stage counts in the driver&apos;s store. 3. Stages page: The UI reads the selected stage attempt from the store and displays its task rows.</desc>
<style>
@keyframes handoff {
  0%, 18% { transform: translateY(0); }
  40%, 58% { transform: translateY(121px); }
  82%, 100% { transform: translateY(265px); }
}
@media (prefers-reduced-motion: no-preference) {
  #focus { display: inline; animation: handoff 4.6s ease-in-out 1 both; }
}
@media (prefers-reduced-motion: reduce) { #focus { display: none; animation: none; } }
</style>
