  <circle cx="24" cy="30" r="12" fill="#184d50"/>
  <text x="24" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">1</text>
  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="36">Executor JVM</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="61">The operator keeps each</tspan><tspan x="62" y="84">order ID and sends only</tspan><tspan x="62" y="107">the status to Python.</tspan></text>
  <rect x="48" y="131" width="302" height="111" rx="9" fill="#fff" stroke="#a8bdbb"/>
  <circle cx="24" cy="151" r="12" fill="#184d50"/>
  <text x="24" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">2</text>
  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="157">Python worker</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="182">Runs the paid-status</tspan><tspan x="62" y="205">function and returns the</tspan><tspan x="62" y="228">results in input order.</tspan></text>
  <rect x="48" y="252" width="302" height="111" rx="9" fill="#fff" stroke="#a8bdbb"/>
  <circle cx="24" cy="272" r="12" fill="#184d50"/>
  <text x="24" y="278" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">3</text>
  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="278">Row assembly</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="303">The operator pairs each</tspan><tspan x="62" y="326">result with the oldest</tspan><tspan x="62" y="349">saved order ID.</tspan></text>
</g>
