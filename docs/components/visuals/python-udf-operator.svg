<svg xmlns="http://www.w3.org/2000/svg" width="360" height="373" viewBox="0 0 360 373" role="img" aria-labelledby="flow-title" aria-describedby="flow-desc">
<title id="flow-title">Scalar Python UDF operator: crossing the executor JVM boundary: Flow at a glance</title>
<desc id="flow-desc">1. Executor JVM: The operator keeps each order ID and sends only the status to Python. 2. Python worker: Runs the paid-status function and returns the results in input order. 3. Row assembly: The operator pairs each result with the oldest saved order ID.</desc>
<style>
@keyframes handoff {
  0%, 18% { transform: translateY(0); }
  40%, 58% { transform: translateY(121px); }
  82%, 100% { transform: translateY(242px); }
}
@media (prefers-reduced-motion: no-preference) {
  #focus { display: inline; animation: handoff 4.6s ease-in-out 1 both; }
}
@media (prefers-reduced-motion: reduce) { #focus { display: none; animation: none; } }
</style>
