<svg xmlns="http://www.w3.org/2000/svg" width="360" height="396" viewBox="0 0 360 396" role="img" aria-labelledby="flow-title" aria-describedby="flow-desc">
<title id="flow-title">Broadcast hash join: probing one partition at a time: Flow at a glance</title>
<desc id="flow-desc">1. Broadcast exchange: The exchange builds and broadcasts a hash table keyed by region ID. 2. Executor task: The task looks up each order&apos;s region ID and checks each candidate&apos;s minimum amount. 3. Left join output: The task emits a row per match, or one row with a null label if none qualify.</desc>
<style>
@keyframes handoff {
  0%, 18% { transform: translateY(0); }
  40%, 58% { transform: translateY(121px); }
  82%, 100% { transform: translateY(265px); }
}
@media (prefers-reduced-motion: no-preference) {
  #focus { display: inline; animation: handoff 4.6s ease-in-out 1 both; }
}
@media (prefers-reduced-motion: reduce) { #focus { display: none; animation: none; } }
</style>
