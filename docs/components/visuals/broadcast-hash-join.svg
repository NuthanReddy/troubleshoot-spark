  <text font-size="18" fill="#223a40"><tspan x="62" y="182">The task looks up each</tspan><tspan x="62" y="205">order&apos;s region ID and</tspan><tspan x="62" y="228">checks each candidate&apos;s</tspan><tspan x="62" y="251">minimum amount.</tspan></text>
