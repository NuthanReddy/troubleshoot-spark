  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="278">Result handler</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="303">Receives one result per</tspan><tspan x="62" y="326">requested partition.</tspan></text>
</g>
