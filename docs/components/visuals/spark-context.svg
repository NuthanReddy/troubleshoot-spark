<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img" aria-labelledby="flow-title" aria-describedby="flow-desc">
<title id="flow-title">SparkContext: the application and job-submission boundary: Flow at a glance</title>
<desc id="flow-desc">1. RDD action: Calls runJob with a function and selected partitions. 2. SparkContext: Cleans the closure and hands the job to the DAG scheduler. 3. Result handler: Receives one result per requested partition.</desc>
<style>
@keyframes handoff {
  0%, 18% { transform: translateY(0); }
  40%, 58% { transform: translateY(121px); }
  82%, 100% { transform: translateY(242px); }
}
@media (prefers-reduced-motion: no-preference) {
  #focus { display: inline; animation: handoff 4.6s ease-in-out 1 both; }
}
@media (prefers-reduced-motion: reduce) { #focus { display: none; animation: none; } }
</style>
