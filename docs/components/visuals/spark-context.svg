  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="36">RDD action</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="61">Calls runJob with a</tspan><tspan x="62" y="84">function and selected</tspan><tspan x="62" y="107">partitions.</tspan></text>
  <rect x="48" y="131" width="302" height="111" rx="9" fill="#fff" stroke="#a8bdbb"/>
  <circle cx="24" cy="151" r="12" fill="#184d50"/>
  <text x="24" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">2</text>
  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="157">SparkContext</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="182">Cleans the closure and</tspan><tspan x="62" y="205">hands the job to the DAG</tspan><tspan x="62" y="228">scheduler.</tspan></text>
  <rect x="48" y="252" width="302" height="88" rx="9" fill="#fff" stroke="#a8bdbb"/>
