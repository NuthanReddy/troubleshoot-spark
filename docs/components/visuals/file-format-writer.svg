  <text font-size="18" fill="#223a40"><tspan x="62" y="61">Feed the write task three</tspan><tspan x="62" y="84">east rows followed by one</tspan><tspan x="62" y="107">west row.</tspan></text>
  <rect x="48" y="131" width="302" height="111" rx="9" fill="#fff" stroke="#a8bdbb"/>
  <circle cx="24" cy="151" r="12" fill="#184d50"/>
  <text x="24" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">2</text>
  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="157">Parquet write task</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="182">With a two-row file limit,</tspan><tspan x="62" y="205">write two east files and</tspan><tspan x="62" y="228">one west file.</tspan></text>
  <rect x="48" y="252" width="302" height="134" rx="9" fill="#fff" stroke="#a8bdbb"/>
