<title id="flow-title">FileFormatWriter: turning a V1 file write into Spark tasks: Flow at a glance</title>
<desc id="flow-desc">1. Spark partition 7: Feed the write task three east rows followed by one west row. 2. Parquet write task: With a two-row file limit, write two east files and one west file. 3. Driver: After all write tasks succeed, call job commit with their commit messages.</desc>
