  <text font-size="18" fill="#223a40"><tspan x="62" y="61">Hits an exception while</tspan><tspan x="62" y="84">running partition 7.</tspan></text>
  <rect x="48" y="108" width="302" height="111" rx="9" fill="#fff" stroke="#a8bdbb"/>
  <circle cx="24" cy="128" r="12" fill="#184d50"/>
  <text x="24" y="134" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">2</text>
  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="134">Task set manager</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="159">Counts one failure and</tspan><tspan x="62" y="182">queues partition 7 again</tspan><tspan x="62" y="205">because retries remain.</tspan></text>
  <rect x="48" y="229" width="302" height="111" rx="9" fill="#fff" stroke="#a8bdbb"/>
  <circle cx="24" cy="249" r="12" fill="#184d50"/>
