<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img" aria-labelledby="flow-title" aria-describedby="flow-desc">
<title id="flow-title">TaskSetManager: choosing and retrying a partition attempt: Flow at a glance</title>
<desc id="flow-desc">1. Attempt 0: Hits an exception while running partition 7. 2. Task set manager: Counts one failure and queues partition 7 again because retries remain. 3. Attempt 1: Starts with a new task ID on the next compatible offer.</desc>
