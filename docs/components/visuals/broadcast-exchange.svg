<svg xmlns="http://www.w3.org/2000/svg" width="360" height="304" viewBox="0 0 360 304" role="img" aria-labelledby="flow-title" aria-describedby="flow-desc">
<title id="flow-title">Broadcast exchange: building the small side: Flow at a glance</title>
<desc id="flow-desc">1. Build tasks: Send region rows to the driver. 2. Driver exchange: Build a hashed relation keyed by region ID. 3. Core broadcast: Publish the relation and return its handle.</desc>
<style>
@keyframes handoff {
  0%, 18% { transform: translateY(0); }
  40%, 58% { transform: translateY(98px); }
  82%, 100% { transform: translateY(196px); }
}
@media (prefers-reduced-motion: no-preference) {
  #focus { display: inline; animation: handoff 4.6s ease-in-out 1 both; }
}
@media (prefers-reduced-motion: reduce) { #focus { display: none; animation: none; } }
</style>
<rect x="1" y="1" width="358" height="302" rx="13" fill="#f2f7f6" stroke="#b8cbc8"/>
