<svg xmlns="http://www.w3.org/2000/svg" width="360" height="373" viewBox="0 0 360 373" role="img" aria-labelledby="flow-title" aria-describedby="flow-desc">
<title id="flow-title">Spark SQL physical planner: choosing the operators: Flow at a glance</title>
<desc id="flow-desc">1. Logical join: The planner receives an optimized left join of orders and regions. 2. Build side: The planner picks a hash join that broadcasts the small right side, regions. 3. Prepared plan: A preparation rule adds the exchange that will broadcast regions.</desc>
