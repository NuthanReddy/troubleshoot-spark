<title id="flow-title">ApplicationMaster: coordinating one YARN application attempt: Flow at a glance</title>
<desc id="flow-desc">1. ApplicationMaster: Starts PythonRunner on a driver thread in cluster mode. 2. Driver scheduler: Passes the SparkContext to the waiting AM. 3. ApplicationMaster: Registers with the ResourceManager and creates the executor allocator.</desc>
