<g font-family="Arial, Helvetica, sans-serif">
  <rect x="48" y="10" width="302" height="88" rx="9" fill="#fff" stroke="#a8bdbb"/>
  <circle cx="24" cy="30" r="12" fill="#184d50"/>
  <text x="24" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">1</text>
  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="36">Driver</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="61">Publish the value as</tspan><tspan x="62" y="84">numbered pieces.</tspan></text>
  <rect x="48" y="108" width="302" height="88" rx="9" fill="#fff" stroke="#a8bdbb"/>
  <circle cx="24" cy="128" r="12" fill="#184d50"/>
  <text x="24" y="134" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">2</text>
  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="134">Cold executor</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="159">Fetch missing pieces from</tspan><tspan x="62" y="182">their holders.</tspan></text>
  <rect x="48" y="206" width="302" height="88" rx="9" fill="#fff" stroke="#a8bdbb"/>
  <circle cx="24" cy="226" r="12" fill="#184d50"/>
  <text x="24" y="232" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">3</text>
  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="232">Same executor</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="257">Rebuild the value from the</tspan><tspan x="62" y="280">ordered pieces.</tspan></text>
</g>
