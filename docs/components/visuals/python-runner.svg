<svg xmlns="http://www.w3.org/2000/svg" width="360" height="396" viewBox="0 0 360 396" role="img" aria-labelledby="flow-title" aria-describedby="flow-desc">
<title id="flow-title">BasePythonRunner: the executor JVM&apos;s side of a Python invocation: Flow at a glance</title>
<desc id="flow-desc">1. Executor runner: The runner gets a local worker and gives the task an output iterator. 2. Socket exchange: As the task pulls output, the runner feeds input and reads results over the same socket. 3. Clean finish: The runner releases a reusable worker only after reading its final reply.</desc>
<style>
@keyframes handoff {
