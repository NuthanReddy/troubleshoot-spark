  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="157">Socket exchange</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="182">As the task pulls output,</tspan><tspan x="62" y="205">the runner feeds input and</tspan><tspan x="62" y="228">reads results over the</tspan><tspan x="62" y="251">same socket.</tspan></text>
  <rect x="48" y="275" width="302" height="111" rx="9" fill="#fff" stroke="#a8bdbb"/>
  <circle cx="24" cy="295" r="12" fill="#184d50"/>
