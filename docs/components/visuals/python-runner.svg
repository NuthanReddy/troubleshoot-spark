  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="36">Executor runner</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="61">The runner gets a local</tspan><tspan x="62" y="84">worker and gives the task</tspan><tspan x="62" y="107">an output iterator.</tspan></text>
  <rect x="48" y="131" width="302" height="134" rx="9" fill="#fff" stroke="#a8bdbb"/>
  <circle cx="24" cy="151" r="12" fill="#184d50"/>
