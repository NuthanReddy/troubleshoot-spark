<svg xmlns="http://www.w3.org/2000/svg" width="360" height="373" viewBox="0 0 360 373" role="img" aria-labelledby="flow-title" aria-describedby="flow-desc">
<title id="flow-title">HDFS NameNode: resolving a path without touching its bytes: Flow at a glance</title>
<desc id="flow-desc">1. HDFS client: Ask where to read byte 4096 of an orders part file. 2. NameNode: Return block 123 and its reported replica addresses on DataNodes A and B. 3. DataNode A: Serve the requested range directly to the client that chose A.</desc>
<style>
@keyframes handoff {
  0%, 18% { transform: translateY(0); }
  40%, 58% { transform: translateY(121px); }
  82%, 100% { transform: translateY(242px); }
}
@media (prefers-reduced-motion: no-preference) {
  #focus { display: inline; animation: handoff 4.6s ease-in-out 1 both; }
}
@media (prefers-reduced-motion: reduce) { #focus { display: none; animation: none; } }
</style>
<rect x="1" y="1" width="358" height="371" rx="13" fill="#f2f7f6" stroke="#b8cbc8"/>
<path d="M24 30 V272" fill="none" stroke="#577d7b" stroke-width="2"/>
<g font-family="Arial, Helvetica, sans-serif">
  <rect x="48" y="10" width="302" height="111" rx="9" fill="#fff" stroke="#a8bdbb"/>
  <circle cx="24" cy="30" r="12" fill="#184d50"/>
  <text x="24" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">1</text>
  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="36">HDFS client</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="61">Ask where to read byte</tspan><tspan x="62" y="84">4096 of an orders part</tspan><tspan x="62" y="107">file.</tspan></text>
  <rect x="48" y="131" width="302" height="111" rx="9" fill="#fff" stroke="#a8bdbb"/>
  <circle cx="24" cy="151" r="12" fill="#184d50"/>
  <text x="24" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">2</text>
  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="157">NameNode</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="182">Return block 123 and its</tspan><tspan x="62" y="205">reported replica addresses</tspan><tspan x="62" y="228">on DataNodes A and B.</tspan></text>
  <rect x="48" y="252" width="302" height="111" rx="9" fill="#fff" stroke="#a8bdbb"/>
  <circle cx="24" cy="272" r="12" fill="#184d50"/>
  <text x="24" y="278" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">3</text>
  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="278">DataNode A</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="303">Serve the requested range</tspan><tspan x="62" y="326">directly to the client that</tspan><tspan x="62" y="349">chose A.</tspan></text>
</g>
