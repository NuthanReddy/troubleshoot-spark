<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img" aria-labelledby="flow-title" aria-describedby="flow-desc">
<title id="flow-title">Py4J gateway: the local Python-to-JVM bridge: Flow at a glance</title>
<desc id="flow-desc">1. Python DataFrame: Calls collectToPython on the driver JVM through Py4J. 2. Driver JVM: Returns connection details for a separate data socket. 3. Python driver: Reads row batches from that socket into a list.</desc>
<style>
@keyframes handoff {
