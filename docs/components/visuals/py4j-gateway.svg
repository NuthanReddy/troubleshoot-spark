  <text font-size="18" fill="#223a40"><tspan x="62" y="61">Calls collectToPython on</tspan><tspan x="62" y="84">the driver JVM through</tspan><tspan x="62" y="107">Py4J.</tspan></text>
  <rect x="48" y="131" width="302" height="111" rx="9" fill="#fff" stroke="#a8bdbb"/>
  <circle cx="24" cy="151" r="12" fill="#184d50"/>
