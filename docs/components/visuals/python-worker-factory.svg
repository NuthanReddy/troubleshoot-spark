  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="180">Worker factory</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="205">If no worker is idle, the</tspan><tspan x="62" y="228">factory connects to its</tspan><tspan x="62" y="251">local Unix daemon.</tspan></text>
  <rect x="48" y="275" width="302" height="111" rx="9" fill="#fff" stroke="#a8bdbb"/>
