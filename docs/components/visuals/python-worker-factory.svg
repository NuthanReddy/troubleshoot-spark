  <text font-size="18" fill="#223a40"><tspan x="62" y="61">The runner requests a</tspan><tspan x="62" y="84">local worker for the</tspan><tspan x="62" y="107">task&apos;s Python</tspan><tspan x="62" y="130">environment.</tspan></text>
  <rect x="48" y="154" width="302" height="111" rx="9" fill="#fff" stroke="#a8bdbb"/>
  <circle cx="24" cy="174" r="12" fill="#184d50"/>
