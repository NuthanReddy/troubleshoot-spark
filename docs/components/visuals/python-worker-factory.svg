<svg xmlns="http://www.w3.org/2000/svg" width="360" height="396" viewBox="0 0 360 396" role="img" aria-labelledby="flow-title" aria-describedby="flow-desc">
<title id="flow-title">PythonWorkerFactory: obtaining an executor-local interpreter: Flow at a glance</title>
<desc id="flow-desc">1. Executor runner: The runner requests a local worker for the task&apos;s Python environment. 2. Worker factory: If no worker is idle, the factory connects to its local Unix daemon. 3. Socket handoff: The daemon forks a child; the factory gives the runner that child&apos;s socket.</desc>
<style>
@keyframes handoff {
  0%, 18% { transform: translateY(0); }
  40%, 58% { transform: translateY(144px); }
  82%, 100% { transform: translateY(265px); }
}
@media (prefers-reduced-motion: no-preference) {
  #focus { display: inline; animation: handoff 4.6s ease-in-out 1 both; }
}
@media (prefers-reduced-motion: reduce) { #focus { display: none; animation: none; } }
</style>
