<svg xmlns="http://www.w3.org/2000/svg" width="360" height="373" viewBox="0 0 360 373" role="img" aria-labelledby="flow-title" aria-describedby="flow-desc">
<title id="flow-title">YarnAllocator: turning executor targets into container requests: Flow at a glance</title>
<desc id="flow-desc">1. Spark driver: Sets a target of five executors for one resource profile. 2. YarnAllocator: Counts two running, one starting and one pending, then requests one more. 3. Launch worker: Sends a start request to the NodeManager named in a matching grant.</desc>
