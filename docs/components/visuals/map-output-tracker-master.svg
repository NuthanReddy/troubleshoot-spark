<title id="flow-title">MapOutputTrackerMaster: the driver&apos;s directory of map outputs: Flow at a glance</title>
<desc id="flow-desc">1. Map task: Reports where attempt 41 wrote its blocks for shuffle 7. 2. Driver scheduler: Records that status in the tracker&apos;s slot for map partition 3. 3. Driver tracker: Answers executor lookups with locations and size estimates.</desc>
