  <text font-size="18" fill="#223a40"><tspan x="62" y="257">Reports the failed</tspan><tspan x="62" y="280">container to the</tspan><tspan x="62" y="303">ResourceManager on a</tspan><tspan x="62" y="326">heartbeat.</tspan></text>
</g>
