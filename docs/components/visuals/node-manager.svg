<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img" aria-labelledby="flow-title" aria-describedby="flow-desc">
<title id="flow-title">YARN NodeManager: from a grant to a process on one worker: Flow at a glance</title>
<desc id="flow-desc">1. NodeManager: Accepts a valid executor start request for its node. 2. Localizer: Fails to fetch a required file from staging. 3. NodeManager: Reports the failed container to the ResourceManager on a heartbeat.</desc>
<style>
@keyframes handoff {
  0%, 18% { transform: translateY(0); }
  40%, 58% { transform: translateY(98px); }
  82%, 100% { transform: translateY(196px); }
}
@media (prefers-reduced-motion: no-preference) {
  #focus { display: inline; animation: handoff 4.6s ease-in-out 1 both; }
}
@media (prefers-reduced-motion: reduce) { #focus { display: none; animation: none; } }
</style>
