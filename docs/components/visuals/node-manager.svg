  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="36">NodeManager</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="61">Accepts a valid executor</tspan><tspan x="62" y="84">start request for its node.</tspan></text>
  <rect x="48" y="108" width="302" height="88" rx="9" fill="#fff" stroke="#a8bdbb"/>
  <circle cx="24" cy="128" r="12" fill="#184d50"/>
  <text x="24" y="134" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">2</text>
  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="134">Localizer</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="159">Fails to fetch a required</tspan><tspan x="62" y="182">file from staging.</tspan></text>
  <rect x="48" y="206" width="302" height="134" rx="9" fill="#fff" stroke="#a8bdbb"/>
  <circle cx="24" cy="226" r="12" fill="#184d50"/>
