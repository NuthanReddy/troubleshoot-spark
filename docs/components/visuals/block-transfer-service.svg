  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="134">Executor 2</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="159">Return a stream handle</tspan><tspan x="62" y="182">for the piece.</tspan></text>
  <rect x="48" y="206" width="302" height="88" rx="9" fill="#fff" stroke="#a8bdbb"/>
