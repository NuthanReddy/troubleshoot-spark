<title id="flow-title">Block transfer service: from a block name to bytes on a socket: Flow at a glance</title>
<desc id="flow-desc">1. Executor 5: Ask executor 2 to open a broadcast piece. 2. Executor 2: Return a stream handle for the piece. 3. Executor 5: Request the chunk and receive its bytes.</desc>
