<title id="flow-title">FileCommitProtocol: staging and finalizing V1 file output: Flow at a glance</title>
<desc id="flow-desc">1. Executor writer: Stage new east and west files for a dynamic partition overwrite. 2. Task protocol: Commit the attempt output and report east and west as touched directories. 3. Driver protocol: Run Hadoop job commit, then replace east and west from staging.</desc>
