  <text font-size="18" fill="#223a40"><tspan x="62" y="61">Stage new east and west</tspan><tspan x="62" y="84">files for a dynamic</tspan><tspan x="62" y="107">partition overwrite.</tspan></text>
  <rect x="48" y="131" width="302" height="111" rx="9" fill="#fff" stroke="#a8bdbb"/>
