  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="157">Task protocol</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="182">Commit the attempt output</tspan><tspan x="62" y="205">and report east and west</tspan><tspan x="62" y="228">as touched directories.</tspan></text>
  <rect x="48" y="252" width="302" height="111" rx="9" fill="#fff" stroke="#a8bdbb"/>
