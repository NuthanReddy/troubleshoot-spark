<svg xmlns="http://www.w3.org/2000/svg" width="360" height="419" viewBox="0 0 360 419" role="img" aria-labelledby="flow-title" aria-describedby="flow-desc">
<title id="flow-title">Spark event log: the records a later reader can replay: Flow at a glance</title>
<desc id="flow-desc">1. Log startup: With event logging enabled, the driver opens the attempt&apos;s log and writes the Spark version. 2. Event listener: Encodes each selected event from its queue as one JSON line. 3. Log writer: The writer flushes at stage completion and finalizes the log on orderly shutdown.</desc>
