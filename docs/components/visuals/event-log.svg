  <text font-size="18" fill="#223a40"><tspan x="62" y="61">With event logging</tspan><tspan x="62" y="84">enabled, the driver opens</tspan><tspan x="62" y="107">the attempt&apos;s log and</tspan><tspan x="62" y="130">writes the Spark version.</tspan></text>
