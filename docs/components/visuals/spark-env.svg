<svg xmlns="http://www.w3.org/2000/svg" width="360" height="327" viewBox="0 0 360 327" role="img" aria-labelledby="flow-title" aria-describedby="flow-desc">
<title id="flow-title">SparkEnv: services local to one Spark JVM: Flow at a glance</title>
<desc id="flow-desc">1. Driver SparkEnv: Registers the endpoint for shuffle map locations. 2. Executor tracker: Gets shuffle locations from the driver on a cache miss. 3. Shuffle reader: Reads the needed blocks from those locations.</desc>
<style>
@keyframes handoff {
  0%, 18% { transform: translateY(0); }
  40%, 58% { transform: translateY(98px); }
  82%, 100% { transform: translateY(219px); }
}
@media (prefers-reduced-motion: no-preference) {
  #focus { display: inline; animation: handoff 4.6s ease-in-out 1 both; }
}
@media (prefers-reduced-motion: reduce) { #focus { display: none; animation: none; } }
</style>
<rect x="1" y="1" width="358" height="325" rx="13" fill="#f2f7f6" stroke="#b8cbc8"/>
<path d="M24 30 V249" fill="none" stroke="#577d7b" stroke-width="2"/>
<g font-family="Arial, Helvetica, sans-serif">
  <rect x="48" y="10" width="302" height="88" rx="9" fill="#fff" stroke="#a8bdbb"/>
  <circle cx="24" cy="30" r="12" fill="#184d50"/>
  <text x="24" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">1</text>
  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="36">Driver SparkEnv</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="61">Registers the endpoint for</tspan><tspan x="62" y="84">shuffle map locations.</tspan></text>
  <rect x="48" y="108" width="302" height="111" rx="9" fill="#fff" stroke="#a8bdbb"/>
  <circle cx="24" cy="128" r="12" fill="#184d50"/>
  <text x="24" y="134" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">2</text>
  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="134">Executor tracker</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="159">Gets shuffle locations</tspan><tspan x="62" y="182">from the driver on a cache</tspan><tspan x="62" y="205">miss.</tspan></text>
  <rect x="48" y="229" width="302" height="88" rx="9" fill="#fff" stroke="#a8bdbb"/>
  <circle cx="24" cy="249" r="12" fill="#184d50"/>
  <text x="24" y="255" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">3</text>
  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="255">Shuffle reader</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="280">Reads the needed blocks</tspan><tspan x="62" y="303">from those locations.</tspan></text>
</g>
<g id="focus" display="none" aria-hidden="true">
  <circle cx="24" cy="30" r="16" fill="none" stroke="#17484d" stroke-width="2"/>
  <path d="M40 25 l6 5 -6 5 z" fill="#17484d"/>
</g>
</svg>
