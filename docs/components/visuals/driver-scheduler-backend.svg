<title id="flow-title">CoarseGrainedSchedulerBackend: the driver&apos;s executor ledger: Flow at a glance</title>
<desc id="flow-desc">1. Registration: The driver records executor 3 with two cores but zero free. 2. Executor ready: A launch acknowledgement lets the driver offer both cores. 3. Task 41: Uses one core until the driver receives its finish report.</desc>
