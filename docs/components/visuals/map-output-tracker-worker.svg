<svg xmlns="http://www.w3.org/2000/svg" width="360" height="373" viewBox="0 0 360 373" role="img" aria-labelledby="flow-title" aria-describedby="flow-desc">
<title id="flow-title">MapOutputTrackerWorker: the executor&apos;s shuffle lookup cache: Flow at a glance</title>
<desc id="flow-desc">1. Shuffle manager: Asks which blocks contain data for reduce partition 2 of shuffle 7. 2. Executor tracker: Reuses cached map statuses or asks the driver for them. 3. Shuffle reader: Receives nonempty block IDs grouped by serving address.</desc>
