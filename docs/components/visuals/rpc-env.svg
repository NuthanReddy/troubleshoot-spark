  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="157">Driver</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="182">Send LaunchTask back</tspan><tspan x="62" y="205">over that same</tspan><tspan x="62" y="228">connection.</tspan></text>
  <rect x="48" y="252" width="302" height="111" rx="9" fill="#fff" stroke="#a8bdbb"/>
