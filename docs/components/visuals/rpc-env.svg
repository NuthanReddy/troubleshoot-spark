<title id="flow-title">RpcEnv: how a driver sends commands to an executor with no RPC listener: Flow at a glance</title>
<desc id="flow-desc">1. Executor: Open a connection and register its endpoint with the driver. 2. Driver: Send LaunchTask back over that same connection. 3. Executor dispatcher: Deliver the queued command to the local backend.</desc>
