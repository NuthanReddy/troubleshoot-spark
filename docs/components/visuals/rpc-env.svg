  <text font-size="18" fill="#223a40"><tspan x="62" y="61">Open a connection and</tspan><tspan x="62" y="84">register its endpoint with</tspan><tspan x="62" y="107">the driver.</tspan></text>
  <rect x="48" y="131" width="302" height="111" rx="9" fill="#fff" stroke="#a8bdbb"/>
  <circle cx="24" cy="151" r="12" fill="#184d50"/>
