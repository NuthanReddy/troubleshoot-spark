<title id="flow-title">ExecutorAllocationManager: deciding how many executors to request: Flow at a glance</title>
<desc id="flow-desc">1. Task counts: The allocation listener tracks running and pending tasks by resource profile. 2. Executor target: The manager can raise the target for sustained backlog or lower it as demand falls. 3. YARN handoff: The backend sends the desired totals to the application master, which requests containers.</desc>
<style>
@keyframes handoff {
  0%, 18% { transform: translateY(0); }
  40%, 58% { transform: translateY(144px); }
  82%, 100% { transform: translateY(288px); }
}
@media (prefers-reduced-motion: no-preference) {
  #focus { display: inline; animation: handoff 4.6s ease-in-out 1 both; }
}
@media (prefers-reduced-motion: reduce) { #focus { display: none; animation: none; } }
</style>
