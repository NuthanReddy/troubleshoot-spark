  <text x="24" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">1</text>
  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="36">Local writer</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="61">Reserve the block ID</tspan><tspan x="62" y="84">with a write lock.</tspan></text>
  <rect x="48" y="108" width="302" height="88" rx="9" fill="#fff" stroke="#a8bdbb"/>
  <circle cx="24" cy="128" r="12" fill="#184d50"/>
  <text x="24" y="134" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">2</text>
  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="134">Local store</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="159">Keep the records in</tspan><tspan x="62" y="182">memory or on disk.</tspan></text>
  <rect x="48" y="206" width="302" height="88" rx="9" fill="#fff" stroke="#a8bdbb"/>
  <circle cx="24" cy="226" r="12" fill="#184d50"/>
  <text x="24" y="232" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">3</text>
  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="232">Value reader</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="257">Check memory, then disk,</tspan><tspan x="62" y="280">before a peer lookup.</tspan></text>
</g>
