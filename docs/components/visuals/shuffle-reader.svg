<g font-family="Arial, Helvetica, sans-serif">
  <rect x="48" y="10" width="302" height="111" rx="9" fill="#fff" stroke="#a8bdbb"/>
  <circle cx="24" cy="30" r="12" fill="#184d50"/>
  <text x="24" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">1</text>
  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="36">Shuffle manager</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="61">Gives the reader block</tspan><tspan x="62" y="84">IDs and addresses for</tspan><tspan x="62" y="107">reduce partition 2.</tspan></text>
  <rect x="48" y="131" width="302" height="111" rx="9" fill="#fff" stroke="#a8bdbb"/>
  <circle cx="24" cy="151" r="12" fill="#184d50"/>
  <text x="24" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">2</text>
  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="157">Block fetcher</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="182">Reads local blocks from</tspan><tspan x="62" y="205">disk or requests remote</tspan><tspan x="62" y="228">blocks from their servers.</tspan></text>
  <rect x="48" y="252" width="302" height="111" rx="9" fill="#fff" stroke="#a8bdbb"/>
  <circle cx="24" cy="272" r="12" fill="#184d50"/>
  <text x="24" y="278" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">3</text>
  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="278">Shuffle reader</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="303">Decodes the bytes and</tspan><tspan x="62" y="326">yields records to the</tspan><tspan x="62" y="349">reduce task.</tspan></text>
</g>
