  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="36">DAG scheduler</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="61">While handling a task</tspan><tspan x="62" y="84">completion, the scheduler</tspan><tspan x="62" y="107">posts a task-end event.</tspan></text>
  <rect x="48" y="131" width="302" height="134" rx="9" fill="#fff" stroke="#a8bdbb"/>
