<svg xmlns="http://www.w3.org/2000/svg" width="360" height="419" viewBox="0 0 360 419" role="img" aria-labelledby="flow-title" aria-describedby="flow-desc">
<title id="flow-title">LiveListenerBus: from scheduler events to listener callbacks: Flow at a glance</title>
<desc id="flow-desc">1. DAG scheduler: While handling a task completion, the scheduler posts a task-end event. 2. Listener bus: The bus offers the event to each active queue without waiting for its listeners. 3. Queue threads: Each queue delivers accepted events in order, calling its listeners one at a time.</desc>
<style>
@keyframes handoff {
