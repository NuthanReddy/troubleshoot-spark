  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="157">Listener bus</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="182">The bus offers the event</tspan><tspan x="62" y="205">to each active queue</tspan><tspan x="62" y="228">without waiting for its</tspan><tspan x="62" y="251">listeners.</tspan></text>
  <rect x="48" y="275" width="302" height="134" rx="9" fill="#fff" stroke="#a8bdbb"/>
