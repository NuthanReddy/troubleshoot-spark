  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="36">Result stage</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="61">Waits for two missing map</tspan><tspan x="62" y="84">outputs needed by</tspan><tspan x="62" y="107">partition 7.</tspan></text>
  <rect x="48" y="131" width="302" height="111" rx="9" fill="#fff" stroke="#a8bdbb"/>
  <circle cx="24" cy="151" r="12" fill="#184d50"/>
  <text x="24" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">2</text>
  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="157">Map tasks</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="182">Write the two shuffle</tspan><tspan x="62" y="205">outputs and report their</tspan><tspan x="62" y="228">locations to the driver.</tspan></text>
  <rect x="48" y="252" width="302" height="111" rx="9" fill="#fff" stroke="#a8bdbb"/>
  <circle cx="24" cy="272" r="12" fill="#184d50"/>
