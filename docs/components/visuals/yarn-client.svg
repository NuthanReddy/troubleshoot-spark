  <text font-size="18" fill="#223a40"><tspan x="62" y="61">Gives the submission</tspan><tspan x="62" y="84">client an application ID.</tspan></text>
  <rect x="48" y="108" width="302" height="134" rx="9" fill="#fff" stroke="#a8bdbb"/>
