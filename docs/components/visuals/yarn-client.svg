<svg xmlns="http://www.w3.org/2000/svg" width="360" height="373" viewBox="0 0 360 373" role="img" aria-labelledby="flow-title" aria-describedby="flow-desc">
<title id="flow-title">YARN submission client: building the first container&apos;s launch instructions: Flow at a glance</title>
<desc id="flow-desc">1. ResourceManager: Gives the submission client an application ID. 2. Submission client: Stages the local script and submits the cluster-mode AM launch record. 3. NodeManager: Fetches or reuses the listed files for the AM container.</desc>
