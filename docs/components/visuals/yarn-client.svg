  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="134">Submission client</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="159">Stages the local script</tspan><tspan x="62" y="182">and submits the</tspan><tspan x="62" y="205">cluster-mode AM launch</tspan><tspan x="62" y="228">record.</tspan></text>
  <rect x="48" y="252" width="302" height="111" rx="9" fill="#fff" stroke="#a8bdbb"/>
