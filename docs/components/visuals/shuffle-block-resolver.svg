<title id="flow-title">Shuffle block resolver: from a block ID to a byte range: Flow at a glance</title>
<desc id="flow-desc">1. Block manager: Requests reducer 2&apos;s block from shuffle 7, map attempt 41. 2. Block resolver: Reads offsets 40 and 65 from attempt 41&apos;s index. 3. File segment: Points the caller to 25 bytes starting at offset 40 in the data file.</desc>
