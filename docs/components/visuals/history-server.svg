  <text font-size="18" fill="#223a40"><tspan x="62" y="61">The server scans the</tspan><tspan x="62" y="84">shared log directory and</tspan><tspan x="62" y="107">lists attempts from</tspan><tspan x="62" y="130">application events.</tspan></text>
  <rect x="48" y="154" width="302" height="157" rx="9" fill="#fff" stroke="#a8bdbb"/>
