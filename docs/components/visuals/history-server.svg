<svg xmlns="http://www.w3.org/2000/svg" width="360" height="465" viewBox="0 0 360 465" role="img" aria-labelledby="flow-title" aria-describedby="flow-desc">
<title id="flow-title">Spark History Server: rebuilding an application view from files: Flow at a glance</title>
<desc id="flow-desc">1. Log scan: The server scans the shared log directory and lists attempts from application events. 2. Attempt lookup: On a cache miss, the provider reuses a saved store or rebuilds one by replaying the attempt&apos;s log. 3. History page: The server reads that attempt&apos;s store to show recorded stages and tasks without a running driver.</desc>
<style>
@keyframes handoff {
  0%, 18% { transform: translateY(0); }
  40%, 58% { transform: translateY(144px); }
  82%, 100% { transform: translateY(311px); }
}
@media (prefers-reduced-motion: no-preference) {
  #focus { display: inline; animation: handoff 4.6s ease-in-out 1 both; }
}
@media (prefers-reduced-motion: reduce) { #focus { display: none; animation: none; } }
</style>
