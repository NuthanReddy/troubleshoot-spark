  <text x="24" y="180" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">2</text>
  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="180">Attempt lookup</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="205">On a cache miss, the</tspan><tspan x="62" y="228">provider reuses a saved</tspan><tspan x="62" y="251">store or rebuilds one by</tspan><tspan x="62" y="274">replaying the attempt&apos;s</tspan><tspan x="62" y="297">log.</tspan></text>
