  <text font-size="18" fill="#223a40"><tspan x="62" y="61">Registers a local</tspan><tspan x="62" y="84">temporary view named</tspan><tspan x="62" y="107">paid_orders.</tspan></text>
  <rect x="48" y="131" width="302" height="88" rx="9" fill="#fff" stroke="#a8bdbb"/>
