<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img" aria-labelledby="flow-title" aria-describedby="flow-desc">
<title id="flow-title">SparkSession: SQL state and the query entry point: Flow at a glance</title>
<desc id="flow-desc">1. First session: Registers a local temporary view named paid_orders. 2. Sibling session: Shares the SparkContext, not the local views. 3. Name lookup: Cannot resolve that local view in the sibling session.</desc>
