  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="157">Sibling session</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="182">Shares the SparkContext,</tspan><tspan x="62" y="205">not the local views.</tspan></text>
  <rect x="48" y="229" width="302" height="111" rx="9" fill="#fff" stroke="#a8bdbb"/>
