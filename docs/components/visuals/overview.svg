<svg xmlns="http://www.w3.org/2000/svg" width="360" height="373" viewBox="0 0 360 373" role="img" aria-labelledby="flow-title" aria-describedby="flow-desc">
<title id="flow-title">PySpark on YARN: component design reference: Flow at a glance</title>
<desc id="flow-desc">1. ApplicationMaster: Asks the NodeManager named in the grant to launch an executor. 2. Executor: Registers for tasks and separately advertises its block-serving address. 3. Reduce task: Looks up its map output and fetches the bytes from the serving node.</desc>
<style>
