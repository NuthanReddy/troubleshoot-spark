  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="36">ApplicationMaster</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="61">Asks the NodeManager</tspan><tspan x="62" y="84">named in the grant to</tspan><tspan x="62" y="107">launch an executor.</tspan></text>
  <rect x="48" y="131" width="302" height="111" rx="9" fill="#fff" stroke="#a8bdbb"/>
  <circle cx="24" cy="151" r="12" fill="#184d50"/>
