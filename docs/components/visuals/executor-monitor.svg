  <text font-size="18" fill="#223a40"><tspan x="62" y="182">Cached blocks or shuffle</tspan><tspan x="62" y="205">data can extend the idle</tspan><tspan x="62" y="228">deadline; an active</tspan><tspan x="62" y="251">tracked shuffle keeps the</tspan><tspan x="62" y="274">executor ineligible.</tspan></text>
