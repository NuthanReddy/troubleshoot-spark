<svg xmlns="http://www.w3.org/2000/svg" width="360" height="465" viewBox="0 0 360 465" role="img" aria-labelledby="flow-title" aria-describedby="flow-desc">
<title id="flow-title">ExecutorMonitor: deciding which idle executors are candidates: Flow at a glance</title>
<desc id="flow-desc">1. Idle start: The monitor records when an executor&apos;s last running task ends. 2. Stored data: Cached blocks or shuffle data can extend the idle deadline; an active tracked shuffle keeps the executor ineligible. 3. Candidate list: Once the deadline expires, the monitor can return the executor&apos;s ID and resource profile to the manager.</desc>
<style>
@keyframes handoff {
  0%, 18% { transform: translateY(0); }
  40%, 58% { transform: translateY(121px); }
  82%, 100% { transform: translateY(288px); }
}
@media (prefers-reduced-motion: no-preference) {
  #focus { display: inline; animation: handoff 4.6s ease-in-out 1 both; }
}
@media (prefers-reduced-motion: reduce) { #focus { display: none; animation: none; } }
</style>
