  <text x="24" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">1</text>
  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="36">Producing executor</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="61">Registers its local shuffle</tspan><tspan x="62" y="84">directories with the</tspan><tspan x="62" y="107">NodeManager service.</tspan></text>
  <rect x="48" y="131" width="302" height="111" rx="9" fill="#fff" stroke="#a8bdbb"/>
  <circle cx="24" cy="151" r="12" fill="#184d50"/>
  <text x="24" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">2</text>
  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="157">Reducing executor</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="182">Asks the service for</tspan><tspan x="62" y="205">reducer 2&apos;s block from</tspan><tspan x="62" y="228">attempt 41.</tspan></text>
  <rect x="48" y="252" width="302" height="111" rx="9" fill="#fff" stroke="#a8bdbb"/>
  <circle cx="24" cy="272" r="12" fill="#184d50"/>
  <text x="24" y="278" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">3</text>
  <text font-size="19" font-weight="700" fill="#12383d"><tspan x="62" y="278">Shuffle service</tspan></text>
  <text font-size="18" fill="#223a40"><tspan x="62" y="303">Reads the indexed byte</tspan><tspan x="62" y="326">range from local disk and</tspan><tspan x="62" y="349">sends it to the reducer.</tspan></text>
</g>
