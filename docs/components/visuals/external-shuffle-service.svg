<svg xmlns="http://www.w3.org/2000/svg" width="360" height="373" viewBox="0 0 360 373" role="img" aria-labelledby="flow-title" aria-describedby="flow-desc">
<title id="flow-title">External shuffle service: serving map files after an executor exits: Flow at a glance</title>
<desc id="flow-desc">1. Producing executor: Registers its local shuffle directories with the NodeManager service. 2. Reducing executor: Asks the service for reducer 2&apos;s block from attempt 41. 3. Shuffle service: Reads the indexed byte range from local disk and sends it to the reducer.</desc>
<style>
@keyframes handoff {
  0%, 18% { transform: translateY(0); }
  40%, 58% { transform: translateY(121px); }
  82%, 100% { transform: translateY(242px); }
}
@media (prefers-reduced-motion: no-preference) {
  #focus { display: inline; animation: handoff 4.6s ease-in-out 1 both; }
}
@media (prefers-reduced-motion: reduce) { #focus { display: none; animation: none; } }
</style>
